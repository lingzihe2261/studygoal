<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>工作台</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d5b98f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f3eee8; --card:#fffdf8; --line:#ece0cc; --text:#3a2e1e; --muted:#8a7a63;
  --purple:#c79a5e; --purple2:#e1cdb0; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --teal:#14b8a6;
  --shadow:0 4px 18px rgba(140,100,40,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px}
.app{display:block}

/* ---- 顶栏备份横幅 ---- */
#banner{display:none;background:linear-gradient(90deg,#fff7e6,#fff);border:1px solid #ffe2a8;color:#8a5a00;
  padding:10px 14px;margin:10px 14px 0 92px;border-radius:12px;font-size:13px;align-items:center;gap:10px;box-shadow:var(--shadow)}
#banner.show{display:flex}
#banner .b-text{flex:1}
#banner button{background:var(--amber);color:#fff;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px}

/* ---- 导航 ---- */
.nav{position:fixed;top:0;left:0;bottom:0;width:78px;display:flex;flex-direction:column;justify-content:flex-start;gap:7px;
  background:linear-gradient(180deg,#fbf4e9,#f5ead8);border-right:1px solid var(--line);
  z-index:60;padding:16px 6px;overflow-y:auto;box-shadow:2px 0 16px rgba(140,100,40,.08)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;
  padding:9px 2px;border-radius:14px;color:#8a7a63;font-size:10px;font-weight:600;line-height:1.25;letter-spacing:.5px}
.nav .emo{font-size:23px;line-height:1;display:block}
.nav .lbl{display:block;text-align:center}
.nav button.active{background:rgba(213,185,143,.32);color:#9a6b2e;font-weight:800}
.nav button.active .lbl{color:#9a6b2e}

/* ---- 视图 ---- */
#view{padding:16px 14px 24px;margin-left:78px}
@media(min-width:768px){#view{padding:20px 24px 28px}}

/* 书内页：隐藏侧栏，内容占满全宽，并把避让侧栏的横幅/安装条回正 */
body.book-open .nav{display:none}
body.book-open #view{margin-left:0}
body.book-open #banner{margin-left:14px;margin-right:14px}
body.book-open .install-bar{left:50%}
.video-page{padding:18px 16px 40px;max-width:880px;margin:0 auto;}
.video-title{font-size:19px;font-weight:700;margin:6px 0 14px;color:#1f2d3d;}
.video-player{width:100%;border-radius:16px;background:#000;display:block;max-height:78vh;}
.back-btn{display:inline-flex;align-items:center;gap:4px;border:none;background:#eef2f6;color:#33475b;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:44px;}
.back-btn:hover{background:#e2e8f0;}
.copy-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px;}
.copy-h{font-size:20px;font-weight:700;color:#1f2d3d;margin:0;}
.copy-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 2px 14px;}
.chip{border:1px solid #dbe2ea;background:#fff;color:#475569;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;min-height:38px;}
.chip.on{background:#2f6f4f;color:#fff;border-color:#2f6f4f;}
.copy-list{display:flex;flex-direction:column;gap:12px;}
.copy-item{background:#fff;border:1px solid #e8edf2;border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,40,60,.05);}
.copy-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.copy-tag{display:inline-block;background:#eef6f0;color:#2f6f4f;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:600;}
.copy-del{border:none;background:#fdecec;color:#c0392b;border-radius:8px;padding:4px 9px;font-size:14px;cursor:pointer;min-height:36px;}
.copy-text{font-size:15px;line-height:1.7;color:#27323f;white-space:pre-wrap;word-break:break-word;}
.copy-empty{color:#8a97a5;text-align:center;padding:40px 10px;font-size:14px;}
.copy-sel{width:100%;border:1px solid #dbe2ea;border-radius:10px;padding:10px;font-size:15px;margin:4px 0 12px;background:#fff;}

h1.page-title{font-size:20px;margin:2px 0 4px;font-weight:800}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.section-h{font-size:14px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:7px}
.section-h svg{width:18px;height:18px;stroke:var(--purple);fill:none}

.btn-primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow)}
.btn-primary svg{width:18px;height:18px;stroke:#fff;fill:none}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:11px;font-weight:600}
.btn-sm{padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff}
.btn-green{background:var(--green);color:#fff;border:none}
.btn-red{background:var(--red);color:#fff;border:none}
.btn-amber{background:var(--amber);color:#fff;border:none}

/* ---- 待处理项 ---- */
.todo-item{border-radius:14px;padding:13px 14px;margin-bottom:11px;box-shadow:var(--shadow);background:#fff}
.todo-item.overdue{border-left:5px solid var(--red)}
.todo-item.broken{border-left:5px solid var(--red);background:#fff5f5}
.todo-item.rest{border-left:5px solid var(--amber);background:#fffaf0}
.todo-item.today{border-left:5px solid var(--purple)}
.todo-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.todo-name{font-weight:700;font-size:15px}
.todo-tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag-overdue{background:#fde8e8;color:var(--red)}
.tag-broken{background:#fde0e0;color:var(--red)}
.tag-rest{background:#fef0d8;color:#b9760a}
.tag-today{background:#f3eee8;color:var(--purple)}
.todo-desc{font-size:13px;color:var(--muted);margin:7px 0 10px}
.todo-actions{display:flex;gap:8px}
.todo-actions button{flex:1}

/* ---- 目标卡 ---- */
.cards{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:1024px){.cards{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}}
.card{background:var(--card);border-radius:16px;padding:15px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.card-name{font-weight:800;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-ic{display:flex;gap:4px}
.card-ic button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#f4f5fa}
.card-ic svg{width:17px;height:17px;stroke:var(--muted);fill:none}
.card-ic button:hover svg{stroke:var(--purple)}
.rate-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.rate-big{font-size:22px;font-weight:800}
.rate-sub{font-size:12px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:11px 0}
.stat{background:#f7f8fc;border-radius:11px;padding:9px 8px;text-align:center}
.stat .v{font-size:16px;font-weight:800}
.stat .k{font-size:11px;color:var(--muted);margin-top:2px}
.plan{background:#f7f8fc;border-radius:11px;padding:10px 11px;font-size:12.5px;margin:9px 0}
.plan .pl{font-weight:700;color:var(--purple);display:flex;gap:5px;align-items:center;margin-bottom:3px}
.plan .pl svg{width:14px;height:14px;stroke:var(--purple);fill:none}
.plan .pv{color:#4a4f60}
.card-actions{display:flex;gap:8px;margin-top:11px}
.card-actions button{flex:1}
.rec-list{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.rec-line{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#4a4f60;padding:3px 0}
.rec-line .rd{color:var(--muted)}
.rec-line .rb{font-size:10px;background:#fef0d8;color:#b9760a;border-radius:6px;padding:1px 5px;margin-left:5px}
.rec-del{color:var(--red);font-size:12px;padding:2px 6px}

/* ---- 看板 ---- */
.board-card{background:var(--card);border-radius:16px;padding:15px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.ps-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ps-top .ps-t{font-size:15px;font-weight:800;color:#000;flex:1;display:flex;align-items:center;gap:7px}
.ps-top .ps-t svg{width:17px;height:17px;stroke:#d5b98f;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ps-sub{font-size:12px;color:#555;margin-bottom:10px}
.ps-sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,#f3eee8,#f3eee8);border:1px solid #f3eee8;border-radius:13px;padding:11px 13px;margin-bottom:11px}
.ps-big{font-size:30px;font-weight:800;color:#cfb081;line-height:1}
.ps-big small{font-size:13px;font-weight:700;color:#d5b990}
.ps-meta{font-size:12.5px;color:#444;line-height:1.6}
.ps-badge{margin-left:auto;font-size:12px;font-weight:800;border-radius:12px;padding:5px 12px;white-space:nowrap}
.ps-badge.hit{color:#fff;background:linear-gradient(135deg,#a3e635,#4ade80)}
.ps-badge.warn{color:#7a4d00;background:#fde9a9}
.ps-badge.none{color:#777;background:#f2eee8}
.ps-chart{margin:2px 0 4px}
.ps-chart svg{width:100%;height:auto;display:block}
.ps-row-hd{display:flex;align-items:center;gap:8px;margin:10px 0 6px}
.ps-row-hd b{font-size:12.5px;color:#000}
.ps-row-hd .ps-nav{margin-left:auto;display:flex;gap:5px}
.ps-nav button{border:1px solid #f3eee8;background:#fff;color:#cfb081;border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer}
.ps-nav button:disabled{opacity:.4}
.ps-day{border:1px solid #f3eee8;border-radius:11px;margin-bottom:6px;background:#fff;overflow:hidden}
.ps-day[open]{border-color:#eadcc7;box-shadow:0 1px 6px rgba(138,116,240,.08)}
.ps-day summary{display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:12.5px;cursor:pointer;list-style:none}
.ps-day summary::-webkit-details-marker{display:none}
.ps-day summary::before{content:'▸';font-size:10px;color:#d5b98f;flex-shrink:0;transition:transform .15s;width:8px}
.ps-day[open] summary::before{transform:rotate(90deg)}
.ps-wd{font-weight:700;color:#000;flex-shrink:0}
.ps-pct{font-weight:800;color:#cfb081;flex-shrink:0;width:44px;text-align:right}
.ps-track{flex:1;height:8px;border-radius:6px;background:#f3eee8;overflow:hidden;min-width:40px}
.ps-track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#dfcbac,#d0b182)}
.ps-dstat{font-size:11.5px;color:#666;flex-shrink:0;width:86px;text-align:right}
.ps-dstat b.hit{color:#15803d}
.ps-dstat b.warn{color:#b45309}
.ps-detail{border-top:1px dashed #f1e8da;margin:0 10px 0 28px;padding:7px 2px 9px}
.ps-detail .pd-t{font-size:12px;color:#555;margin-bottom:5px}
.pd-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#333;padding:3px 0}
.pd-item .ck{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.pd-item .ck.on{background:#d5b98f}
.pd-item .ck.on svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3}
.pd-item .ck.off{border:1.5px solid #ece0cd;background:#fff}
.pd-item .tx.on{text-decoration:line-through;color:#999}
.pd-none{font-size:12px;color:#999;padding:3px 0}
/* ---- 打卡项月度统计 ---- */
.pm-card{overflow:hidden}
.pm-nav{display:flex;align-items:center;gap:8px;justify-content:center;margin:8px 0 12px;flex-wrap:wrap}
.pm-nav .pm-ym{font-weight:800;color:#000;min-width:96px;text-align:center}
.pm-nav button{border:1px solid #f3eee8;background:#fff;color:#cfb081;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;min-height:32px}
.pm-nav button:disabled{opacity:.4}
.pm-group{margin-bottom:12px}
.pm-chart{width:100%;height:auto;display:block;margin:6px 0 2px}
.pm-statcard .pm-statcard{margin:8px 0 0}
.pm-statcard .pm-statcard .ps-t{white-space:normal;overflow:visible;text-overflow:clip}
.pm-stat-hd .ps-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-gname{font-size:13px;font-weight:800;color:#cfb081;margin:6px 0 6px;display:flex;align-items:center;gap:6px}
.pm-gname::before{content:'';width:4px;height:14px;background:#d0b182;border-radius:2px;display:inline-block}
.pm-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pm-tbl{border-collapse:collapse;width:100%;min-width:420px;font-size:12px}
.pm-tbl th{font-size:11px;color:#888;font-weight:700;padding:5px 4px;border-bottom:1px solid #f3eee8;white-space:nowrap;background:#f3eee8}
.pm-tbl th.pm-curh{color:#cfb081}
.pm-tbl th.pm-bmh{color:#000;border-left:2px solid #f3eee8}
.pm-tbl td{border-bottom:1px solid #f3eee8;text-align:center;padding:6px 4px;height:30px;color:#333}
.pm-tbl td.pm-name{text-align:left;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#222;position:sticky;left:0;background:#fff}
.pm-tbl td.pm-cur{box-shadow:inset 0 0 0 2px #eadcc7}
.pm-tbl td.pm-empty{color:#dcd1c0}
.pm-tbl td.pm-bm{border-left:2px solid #f3eee8;font-weight:700;color:#000}
.pm-tbl td.pm-bm b{color:#15803d}
.pm-statcard{background:var(--card);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.pm-stat-hd{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:2px 0 4px}
.pm-stat-hd .ps-t{font-size:15px;font-weight:800;color:#000;flex:1;display:flex;align-items:center;gap:7px}
.pm-stat-hd .ps-t svg{width:17px;height:17px;stroke:#d5b98f;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pm-arw{font-size:13px;color:#d5b98f;font-weight:800;transition:transform .15s}
.pm-stat-bd{margin-top:8px;border-top:1px dashed #f1e8da;padding-top:10px}
.nutri-row{padding:2px 0}
.nutri-f{font-size:13px;line-height:1.75;margin:8px 0;color:#444}
.nutri-f b{color:#7a4f3c;margin-right:6px;font-weight:800;flex-shrink:0}
.nutri-f{display:flex;flex-wrap:wrap;gap:2px}
.nutri-f b{display:inline-block}
.board-top{display:flex;gap:14px;align-items:center}
.ring-wrap{flex-shrink:0}
.board-info{flex:1;min-width:0}
.board-name{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.board-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.chart-box{margin-top:14px;background:#f7f8fc;border-radius:12px;padding:12px}
.chart-title{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
.chart-note{font-size:11px;color:var(--muted);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---- 周报 ---- */
.week-nav{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);margin-bottom:14px}
.week-nav .wn{font-weight:700}
.wsum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.wsum .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);text-align:center}
.wsum .s .v{font-size:20px;font-weight:800}
.wsum .s .k{font-size:12px;color:var(--muted);margin-top:2px}
.wsum .s .d{font-size:11px;margin-top:3px}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}
.cols{display:grid;gap:11px;grid-template-columns:1fr}
@media(min-width:768px){.cols{grid-template-columns:1fr 1fr}}
.col{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.col h4{margin:0 0 7px;font-size:13px;color:var(--purple)}
.col textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;resize:vertical;min-height:62px;color:var(--text)}
.week-actions{display:flex;gap:8px;margin-top:13px}

/* ---- 我的 ---- */
.mine-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);margin-bottom:13px}
.mine-card h3{margin:0 0 4px;font-size:15px}
.mine-card p{margin:0 0 11px;font-size:12.5px;color:var(--muted)}
.mine-row{display:flex;gap:9px;flex-wrap:wrap}
.bk-status{font-size:12px;color:#8a7a6c;align-self:center}
.mine-row button{flex:1;min-width:120px}
.steps{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.step{display:flex;gap:11px;align-items:flex-start}
.step .n{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.step .t{font-size:13px}
.step .t b{display:block;margin-bottom:1px}
.clear-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:9px 0;letter-spacing:2px}

/* ---- 弹窗 ---- */
.modal-mask{position:fixed;inset:0;background:rgba(20,22,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0}
.modal-mask.show{display:flex}
@media(min-width:768px){.modal-mask{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:768px){.modal{border-radius:18px}}
.modal h3{margin:0 0 14px;font-size:17px;font-weight:800}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:#4a4f60}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfbfe}
.field textarea{resize:vertical;min-height:54px}
.field .hint{font-size:11px;color:var(--muted);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-dates{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.quick-dates button{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:#f7f8fc;font-size:12.5px;font-weight:600}
.quick-dates button.sel{background:var(--purple);color:#fff;border-color:var(--purple)}
.modal-actions{display:flex;gap:10px;margin-top:6px}
.modal-actions button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:15px}
.modal-actions .cancel{background:#f1f2f7;color:var(--text)}
.warn-box{background:#fff5f5;border:1px solid #fdd; border-radius:11px;padding:12px;font-size:13px;color:#a33;margin-bottom:12px}
.confirm-name{font-weight:800;color:var(--red)}

/* ---- 提示 ---- */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
@media(min-width:1024px){#toast{bottom:30px}}

/* ---- 彩带 ---- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300;display:none}
.empty{text-align:center;color:var(--muted);padding:30px 0;font-size:13px}

/* ---- 养生 Tab（原 饮食 Tab） ---- */
.diet-page{background:linear-gradient(180deg,#f3eee8 0%,#f3eee8 140px,var(--bg) 320px);min-height:100%}
.diet-hero{background:linear-gradient(135deg,#f3eee8,#f3eee8);border:1px solid #f3eee8;border-radius:20px;padding:18px 16px;margin-bottom:14px}
.diet-hero h2{margin:0 0 4px;font-size:19px;color:#c6a16a}
.diet-hero p{margin:0;font-size:13px;color:#ddc7a5;line-height:1.6}
.dstat{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
@media(min-width:900px){.dstat{grid-template-columns:repeat(4,1fr)}}
.dstat .c{background:#fff;border:1px solid #f3eee8;border-radius:16px;padding:13px;box-shadow:0 4px 14px rgba(255,150,200,.12)}
.dstat .c .ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ede1cf,#ebdeca);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.dstat .c .ic svg{width:18px;height:18px;stroke:#fff;fill:none}
.dstat .c h4{margin:0;font-size:12.5px;color:#d5b990}
.dstat .c .v{font-size:16px;font-weight:800;margin-top:2px;color:#5b3b2d}
.dstat .c .s{font-size:11.5px;color:#e4d2b7;margin-top:4px;line-height:1.55}
.chip{padding:8px 13px;border-radius:24px;border:1px solid #f3eee8;background:#fff;font-size:13px;font-weight:600;color:#ae745b}
.chip.on{background:linear-gradient(135deg,#e6d6bd,#dec8a7);border-color:transparent;color:#fff}
.ddraw{background:linear-gradient(135deg,#f3eee8,#f3eee8);border:1px dashed #ece0cd;border-radius:20px;padding:18px 16px;margin-bottom:16px;text-align:center}
.ddraw h3{margin:0 0 4px;font-size:16px;color:#c6a16a}
.ddraw .ds{margin:0 0 11px;font-size:12px;color:#e4d2b7}
.draw-btn{background:linear-gradient(135deg,#dfcbac,#d0b182);color:#fff;border:none;border-radius:14px;padding:12px 22px;font-size:15px;font-weight:700;box-shadow:0 6px 16px rgba(139,92,246,.3)}
.draw-out{margin-top:12px;background:#fff;border-radius:14px;padding:12px 13px;font-size:13.5px;line-height:2;color:#4c3f2b;text-align:left}
.draw-out b{color:#d3b78c}
.draw-note{font-size:11.5px;color:#e4d2b7;margin-top:8px}
.section-t{font-size:15px;font-weight:800;margin:20px 0 10px;display:flex;gap:8px;align-items:center;color:#7a4f3c}
.section-t svg{width:18px;height:18px;stroke:#dfcbac;fill:none}
.day{border:1px solid #f3eee8;border-radius:18px;background:#fff;margin-bottom:13px;overflow:hidden;box-shadow:0 4px 14px rgba(255,150,200,.10)}
.day summary{cursor:pointer;list-style:none;padding:13px 15px;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#f3eee8,#f3eee8)}
.day summary::-webkit-details-marker{display:none}
.day summary .wn{font-weight:800;font-size:15px;color:#c6a16a}
.day summary .fr{margin-left:auto;font-size:12px;color:#ddc7a5;background:#fff;border:1px solid #f3eee8;border-radius:14px;padding:3px 10px;white-space:nowrap}
.day summary .fr svg{width:13px;height:13px;stroke:#dfcbac;fill:none;vertical-align:-2px;margin-right:2px}
.meals{display:grid;gap:10px;padding:12px;grid-template-columns:1fr}
@media(min-width:760px){.meals{grid-template-columns:repeat(3,1fr)}}
.meal{background:#f3ebe8;border:1px solid #f3ebe8;border-radius:14px;padding:11px 12px}
.meal h5{margin:0 0 2px;font-size:13px;color:#d3b78c;display:flex;align-items:center;gap:6px}
.meal h5 svg{width:15px;height:15px;stroke:#d3b78c;fill:none}
.meal .tm{font-size:11.5px;color:#e4d2b7;margin-bottom:6px}
.meal ul{margin:0;padding:0;list-style:none}
.meal li{font-size:13px;color:#b79561;padding:2px 0 2px 14px;position:relative}
.meal li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#e6d6bd,#dec8a7)}
.meal .tip{margin-top:7px;font-size:12px;color:#d5b990;background:#fff;border-radius:10px;padding:6px 9px;line-height:1.55}
.meal .tip b{color:#d3b78c}
.meal .ft{margin-top:7px;font-size:11.5px;color:#ddc7a5;border-top:1px dashed #f0e6d8;padding-top:6px}
.meal .ft svg{width:13px;height:13px;stroke:#dfcbac;fill:none;vertical-align:-2px;margin-right:2px}
.fruits{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:8px}
.fruit{background:#fff;border:1px solid #f3eee8;border-radius:14px;padding:11px 12px;box-shadow:0 4px 12px rgba(255,150,200,.08)}
.fruit .fn{font-weight:800;font-size:14px;color:#694333}
.fruit .fd{font-size:12px;color:#d5b990;margin-top:4px;line-height:1.5}
.ftag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:10px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.ftag.p{background:#e3f6ea;color:#1a9d5c}
.ftag.c{background:#e4f1fb;color:#1f7fc9}
.ftag.h{background:#ffe9d8;color:#d97706}
.legend-tip{font-size:12px;color:#e4d2b7;margin:2px 0 6px}
.legend-tip .ftag{margin-left:0;margin-right:8px}
.tea-bd{padding:2px 2px 4px}
.tea-tip{font-size:11.5px;color:#e4d2b7;line-height:1.55;margin-bottom:10px}
.tea-item{border:1px solid #f3eee8;border-radius:14px;padding:11px 13px;margin-bottom:10px;background:#f3eee8}
.tea-item:last-child{margin-bottom:0}
.tea-n{font-size:14.5px;font-weight:800;color:#997b4d}
.tea-e{font-size:12px;color:#c58c74;font-weight:700;margin:3px 0 8px}
.tea-row{display:flex;gap:6px;font-size:12.5px;line-height:1.62;margin:5px 0;color:#564f6e}
.tea-row b{flex:0 0 38px;color:#7a4f3c;font-weight:800}
.tea-row span{flex:1}
.tea-note{font-size:12px;line-height:1.55;color:#b0622e;background:rgba(255,170,90,.12);border-radius:9px;padding:6px 9px;margin-top:7px}

/* ---- 打卡 Tab（低饱和治愈：暖粉薄荷底 + 墨绿 + 暖珊瑚，毛玻璃） ---- */
.pu-page{border-radius:22px;padding:16px 15px 20px;background:linear-gradient(165deg,#f3eee8 0%,#f3eee8 45%,#f3eee8 100%);border:1px solid rgba(255,255,255,.85);box-shadow:0 8px 30px rgba(130,100,75,.10)}
.pu-hero{text-align:center;padding:4px 4px 14px}
.pu-hero .pu-slogan{font-size:11px;letter-spacing:2px;color:#c59c8a;font-weight:700}
.pu-hero h2{margin:2px 0 2px;font-size:23px;color:#c6a16a}
.pu-hero .pu-dt{font-size:12px;color:#c59c8a;margin-top:3px}
.pu-glass{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.92);border-radius:18px;padding:13px 14px;margin-bottom:13px;box-shadow:0 6px 20px rgba(140,110,90,.07)}
.q-card .q-text{font-size:18px;line-height:1.7;color:#4a3b32;font-weight:600;margin:10px 2px 6px;padding-left:12px;border-left:3px solid #c9a27e}
.q-card .q-theme{font-size:11px;font-weight:700;color:#d3b78c;background:#f3eee8;padding:2px 8px;border-radius:20px;margin-left:auto}
.q-card .q-by{font-size:13px;color:#9b8576;text-align:right;margin:2px 0 0}
.q-card .q-note{font-size:12.5px;line-height:1.6;color:#8a7a6c;margin-top:7px;padding:7px 9px;background:rgba(255,255,255,.55);border-radius:9px}
.q-empty{color:#b0a193;font-size:14px;padding:8px 2px}
.pick-date{font-size:12px;font-weight:700;color:#ccb695;margin-bottom:8px;}
.pick-kw{font-size:12.5px;line-height:1.6;color:#b4925f;background:rgba(123,99,230,.10);border-radius:11px;padding:8px 11px;margin:0 0 12px;}
.pu-hd{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.pu-hd .pu-t{font-size:13.5px;font-weight:800;color:#cfb081;flex:1;display:flex;align-items:center;gap:7px}
.pu-hd .pu-t svg{width:16px;height:16px;stroke:#cfb081;fill:none}
.pu-hd .pu-act{display:flex;gap:6px}
.pu-ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);border:1px solid rgba(224,85,154,.2);cursor:pointer}
.pu-ico svg{width:16px;height:16px;stroke:#cfb081;fill:none}
.pu-ico.hot{background:#f3eee8;border-color:rgba(240,138,99,.45)}
.pu-ico.hot svg{stroke:#d3b78c}
.pu-back{height:32px;padding:0 13px;border-radius:10px;background:#f3eee8;border:1px solid rgba(240,138,99,.45);color:#cf7f4a;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center}
.mission-text{font-size:17px;font-weight:800;color:#c6a16a;line-height:1.5;padding:2px 0 4px}
.mission-flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#e2cfb3;margin-bottom:2px}
.punch-sched-card{cursor:pointer;transition:transform .08s ease,box-shadow .12s ease}
.punch-sched-card:active{transform:scale(.985)}
.punch-sched-card:hover{box-shadow:0 8px 24px rgba(140,110,90,.12)}
.pu-go2{font-size:12px;font-weight:700;color:#cf9f7e;background:rgba(207,159,126,.12);border-radius:9px;padding:4px 10px;white-space:nowrap}
.punch-sched-hint{margin-top:8px;font-size:12px;color:#b6a48e;display:flex;align-items:center;gap:5px}
.pu-rate-line{display:flex;align-items:center;gap:14px}
.pu-rate-big{font-size:32px;font-weight:900;color:#ddc7a5;line-height:1}
.pu-rate-side{font-size:12px;color:#c59c8a;line-height:1.6}
.pu-bar{height:9px;background:rgba(224,85,154,.13);border-radius:6px;overflow:hidden;margin-top:9px}
.pu-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#f3eee8,#ddc7a5)}
.spark{display:flex;gap:5px;align-items:flex-end;height:52px;margin-top:14px}
.spark .b{flex:1;border-radius:5px 5px 2px 2px;background:#f3eee8;min-height:3px;position:relative}
.spark .b.hot{background:linear-gradient(180deg,#f3eee8,#ddc7a5)}
.spark .b .d{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:9px;color:#e6d5bc}
.todo-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed rgba(224,85,154,.14)}
.todo-row:last-child{border-bottom:none}
.todo-ck{width:25px;height:25px;border-radius:50%;border:2px solid #ebdeca;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;padding:0}
.todo-ck svg{width:13px;height:13px;stroke:#fff;fill:none;display:none}
.todo-ck.done{background:#cfb081;border-color:#cfb081}
.todo-ck.done svg{display:block}
.todo-txt{flex:1;font-size:14.5px;color:#b89664;line-height:1.4}
.todo-txt.done{color:#e6d5bc;text-decoration:line-through}
.todo-txt-in{flex:1;min-width:0;border:none;background:transparent;font-size:14.5px;color:#000;line-height:1.4;padding:4px 0;border-bottom:1px dashed transparent}
.todo-txt-in:focus{border-bottom-color:#d5b98f;outline:none}
.todo-txt-in.done{color:#e6d5bc;text-decoration:line-through}
.todo-ins,.todo-del{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.todo-ins svg{width:15px;height:15px;stroke:#d5b98f;fill:none}
.todo-del{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#e3d0b4;flex-shrink:0}
.todo-del svg{width:15px;height:15px;stroke:#d3b78c;fill:none}
.todo-empty{font-size:12.5px;color:#e6d5bc;text-align:center;padding:10px 0}
.todo-add{display:flex;gap:8px;margin-top:10px}
.supp-prog{font-size:13px;color:#5a5168;margin:8px 2px 6px}
.supp-prog b{color:#d2b589;font-size:15px}
.supp-list{display:flex;flex-direction:column;gap:7px}
.supp-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#f3eee8;border:1px solid #f3eee8;border-radius:12px}
.supp-chk{display:flex;align-items:center;gap:9px;cursor:pointer;flex:1;min-width:0}
.supp-chk input{width:19px;height:19px;accent-color:#d2b589;flex:0 0 auto}
.supp-name{font-size:15px;color:#554630}
.supp-name.done{color:#cebea7;text-decoration:line-through}
.supp-del{background:none;border:none;color:#e25555;font-size:13px;padding:5px 10px;cursor:pointer;border-radius:8px;flex:0 0 auto}
.supp-del:hover{background:#ffe9e9}
.supp-add{display:flex;gap:8px;margin-top:12px}
.supp-add .suppIn{flex:1;border:1px solid rgba(124,92,255,.22);border-radius:12px;padding:10px 12px;font-size:16px;background:rgba(255,255,255,.9);color:#5a5168;min-width:0}
.supp-add .suppIn::placeholder{color:#e0d3bf}
.supp-empty{font-size:13px;color:#8a90a2;margin:6px 2px}
.supp-empty .pu-btn{margin-left:8px}
.supp-plan{background:linear-gradient(135deg,#fff7ef,#fff);border:1px solid #ffeddc;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.supp-plan-hd{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.supp-plan-hd .sp-ic{width:18px;height:18px;stroke:#f0885f;fill:none;flex:0 0 auto}
.supp-plan-hd span{font-size:14px;font-weight:800;color:#6b4a2f;flex:1}
.supp-plan-hd .pu-btn.sm{padding:5px 12px;font-size:13px;border-radius:10px;box-shadow:none}
.supp-plan-body{font-size:14.5px;line-height:1.75;color:#5a4632}
.supp-plan-body div{padding:1px 0}
.supp-plan-body .muted{color:#e0d3bf;font-size:13px}
.suppPlanIn{width:100%;border:1px solid rgba(240,136,95,.3);border-radius:12px;padding:10px 12px;font-size:15px;background:#fff;color:#5a4632;min-height:84px;resize:vertical;line-height:1.6}
.supp-plan-act{display:flex;gap:8px;margin-top:9px}
.pu-btn.ghost{background:#f3eee8;color:#d2b589;box-shadow:none}
.todo-emptyadd{margin-top:10px}
.todo-emptyadd .pu-btn{width:100%;justify-content:center;padding:11px 0;font-size:15px}
.todo-add input{flex:1;border:1px solid rgba(224,85,154,.22);border-radius:12px;padding:10px 12px;font-size:15px;background:rgba(255,255,255,.85);color:#b99765;min-width:0}
.todo-add input::placeholder{color:#eee2d1}
.pu-btn{background:linear-gradient(135deg,#ede1cf,#ddc7a5);color:#fff;border:none;border-radius:12px;padding:10px 15px;font-size:14px;font-weight:700;box-shadow:0 5px 14px rgba(240,138,99,.3);display:flex;align-items:center;gap:6px}
.pu-btn svg{width:16px;height:16px;stroke:#fff;fill:none}
.pu-note-area{width:100%;border:1px solid rgba(224,85,154,.2);border-radius:12px;padding:10px 12px;resize:vertical;min-height:66px;background:rgba(255,255,255,.85);color:#b99765;font-size:14.5px}
.pu-note-area::placeholder{color:#eee2d1}
.pu-tools{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center}
.pu-ghost{background:rgba(255,255,255,.8);border:1px solid rgba(224,85,154,.25);color:#cfb081;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.pu-ghost svg{width:15px;height:15px;stroke:#cfb081;fill:none}
.pu-imgprev{display:flex;gap:10px;align-items:center;margin-top:9px;background:rgba(255,255,255,.85);border:1px solid rgba(224,85,154,.15);padding:7px;border-radius:12px}
.pu-imgprev img{width:76px;height:76px;object-fit:cover;border-radius:9px;cursor:pointer}
.pu-imgprev .pu-meta{font-size:11.5px;color:#e2cfb3;flex:1;line-height:1.5}
.pu-hint{font-size:11px;color:#e6d5bc;margin-top:8px}
.tl-date{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#c6a16a;background:#f3eee8;padding:4px 12px;border-radius:16px;margin:13px 0 7px}
.tl-item{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);border-radius:14px;padding:9px 10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.tl-txt{flex:1;font-size:13.5px;color:#b89664;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.tl-thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;flex-shrink:0;border:1px solid rgba(224,85,154,.15)}
.tl-del{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tl-del svg{width:14px;height:14px;stroke:#d3b78c;fill:none}
.tl-empty{font-size:12.5px;color:#e6d5bc;text-align:center;padding:8px 0}
.rev-row{padding:9px 4px;border-bottom:1px dashed rgba(224,85,154,.15);font-size:13.5px;color:#b89664}
.rev-row:last-child{border-bottom:none}
.rev-row b{color:#c6a16a;display:block;font-size:12px;margin-bottom:2px}

.pu-hero .pu-slogan{color:#dac19c}
.pu-hero h2{color:#cdad7c}
.pu-hero .pu-dt{color:#ddc7a5}

/* 工作日程编辑 */
.sch-grid{display:flex;flex-direction:column;gap:9px;max-height:52vh;overflow:auto;padding-right:2px}
.sch-row{border:1px solid #f3eee8;border-radius:12px;padding:8px 9px;background:#f3eee8}

<script>
"use strict";
/* ============ 基础工具 ============ */
const KEY='wb_studygoal_v1';
const T=(function(){const d=new Date();d.setHours(0,0,0,0);return d;})();
function fmt(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function parse(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){const x=new Date(d);const day=x.getDay();const diff=(day===0)?-6:(1-day);x.setDate(x.getDate()+diff);x.setHours(0,0,0,0);return x;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============ 数据层 ============ */
const SUPP_PLAN_DEFAULT='';
const SUPP_PLAN_OLD='早餐后：B1+B2+B6+B7+B12+D3+叶黄素+PS（2片）\n午餐后：锌\n晚餐后：铁+维C+叶酸';
function morningDefault(){
  return {
    vow:[
      '中舍性：愿我今天，无论遇到顺境还是逆境，都能保持内心的平衡与觉知，愿我能以智慧面对感受，不贪不嗔。',
      '悲悯：愿我今天，能以悲悯之心对待自己，对待他人，愿我在看到苦难时，不生冷漠，不生嗔恨，能尽我所能给予一丝温暖与支持。',
      '信：佛陀的智慧与行为，是圆满的。',
      '慈心禅：愿我远离痛苦，愿我充满智慧与安乐，愿一切众生安好。',
      '查理•芒格：我们的经验往往会验证一个长久以来的观念：只要做好准备，在人生中抓住几个机会，迅速地采取适当的行动，去做简单而合乎逻辑的事情，这辈子的财富就会得到极大的增长。\n上面提到的这种机会很少，它们通常会落在不断地寻找和等待、充满求知欲望而又热衷于对各种不同的可能性作出分析的人头上。\n这样的机会来临之后，如果获胜的机率极高，那么动用过去的谨慎和耐心得来的资源，重重地压下赌注就可以了。'
    ],
    oral:[
      '百炼成钢｜练唇力，改善吞音',
      '牛郎刘娘｜练n/l，不嘴瓢',
      '山河锦绣｜纠正口水音',
      '乘风破浪｜稳气息，护嗓子',
      '澎湃磅礴、颠倒吞吐、天翻地覆、山河壮丽',
      '八百标兵奔北坡',
      '刘奶奶的榴莲牛奶',
      '炖冻豆腐',
      '班干部管班干部',
      '黑化肥挥发',
      '三山撑四水',
      '牛奶、来年、力量、罗列',
      '众所周知',
      '特盗太刁',
      '表述者、软科学、追随者、算术题、总资产',
      '数字资产'
    ]
  };
}
const MORNING_DEFAULT=morningDefault();
let state=loadData();
let booting=true;
function loadData(){
  try{const raw=localStorage.getItem(KEY);if(raw){return normalize(JSON.parse(raw));}}catch(e){}
  return buildExampleData();
}
function saveData(){localStorage.setItem(KEY,JSON.stringify(state));if(!booting)dailyBackupCheck();}

function normalize(d){
  d=d||{};
  const goals=Array.isArray(d.goals)?d.goals:[];
  const ng=goals.map(function(g){
    const total=(g.total!=null)?g.total:(g.target!=null?g.target:0);
    const recs=Array.isArray(g.records)?g.records:(Array.isArray(g.logs)?g.logs:[]);
    const nr=recs.map(function(r){return{
      id:r.id||uid(),
      date:r.date||(r.day?r.day:fmt(T)),
      amount:Number(r.amount!=null?r.amount:(r.count!=null?r.count:0)),
      minutes:(r.minutes!=null&&r.minutes!=='')?Number(r.minutes):null,
      backfill:!!r.backfill,
      note:r.note||''
    };});
    return{
      id:g.id||uid(),name:g.name||'未命名目标',unit:g.unit||'次',total:Number(total)||0,
      deadline:g.deadline||fmt(addDays(T,30)),color:g.color||'#d5b98f',
      obstacle:g.obstacle||'',strategy:g.strategy||'',example:!!g.example,celebrated:!!g.celebrated,records:nr
    };
  });
  /* 清理示例卡：不再预置读书/背单词示例（老示例存有也一并移除，用户自建不动） */
  const DROP_EX={'背英语单词':1,'Python 入门课':1,'读《人类简史》':1,'读《认知觉醒》':1,'读《非暴力沟通》':1};
  const ng2=ng.filter(function(g){return !(g.example&&DROP_EX[g.name]);});
  const weekly=(d.weekly&&typeof d.weekly==='object')?d.weekly:{};
  const diet=(d.diet&&typeof d.diet==='object')?d.diet:{};
  if(!diet.ate||typeof diet.ate!=='object')diet.ate={};
  if(!diet.cups||typeof diet.cups!=='object')diet.cups={};
  if(!('draw' in diet))diet.draw=null;
  if(!diet.supp||typeof diet.supp.log!=='object')diet.supp={log:{},seedVer:0};
  if(!('plan' in diet.supp))diet.supp.plan=SUPP_PLAN_DEFAULT;
  if(diet.supp.plan===SUPP_PLAN_OLD)diet.supp.plan='';
  if(!diet.suppD||typeof diet.suppD.log!=='object')diet.suppD={log:{},seedVer:0};
  if(!('plan' in diet.suppD))diet.suppD.plan='';
  const punch=(d.punch&&typeof d.punch==='object')?d.punch:{};

/* ============ 计算层（纯函数） ============ */
function sumAmount(g){return g.records.reduce(function(s,r){return s+r.amount;},0);}
function goalRemaining(g){return Math.max(0,g.total-sumAmount(g));}
function goalCompletion(g){return g.total>0?sumAmount(g)/g.total:0;}
function datesSet(g){const s=new Set();g.records.forEach(function(r){s.add(r.date);});return s;}
function isOverdue(g){return parse(g.deadline)<T && goalRemaining(g)>0;}

function computeStreak(g){
  const set=datesSet(g);let streak=0;const restUsed={};let d=addDays(T,-1);let guard=0;
  while(guard++<4000){
    const w=fmt(mondayOf(d));
    if(set.has(fmt(d))){streak++;}
    else{if(!restUsed[w]){restUsed[w]=true;streak++;}else{break;}}
    d=addDays(d,-1);
  }
  return streak;
}
function yesterdayStatus(g){
  const set=datesSet(g);const y=fmt(addDays(T,-1));
  if(set.has(y))return 'done';
  const wStart=mondayOf(addDays(T,-1));let misses=0;let d=new Date(wStart);const end=addDays(T,-1);
  while(d<=end){if(!set.has(fmt(d)))misses++;d=addDays(d,1);}
  return misses<=1?'rest':'broken';
}
function todaySuggested(g){
  const rem=goalRemaining(g);if(rem<=0)return 0;
  let days=Math.floor((parse(g.deadline)-T)/86400000)+1;if(days<=0)days=1;
  return Math.ceil(rem/days);
}
function estCompletion(g){
  const rem=goalRemaining(g);if(rem<=0)return {done:true};
  const start=fmt(addDays(T,-6));
  let sum7=0;g.records.forEach(function(r){if(r.date>=start&&r.date<=fmt(T))sum7+=r.amount;});
  if(sum7<=0)return {none:true};
  const avg=sum7/7;const need=Math.ceil(rem/avg);const est=addDays(T,need);
  const diff=Math.round((est-parse(g.deadline))/86400000);
  return {estStr:fmt(est),diff:diff};
}
function totalRecords(){return state.goals.reduce(function(s,g){return s+g.records.length;},0);}

function weekSummary(ws){
  const we=addDays(parse(ws),6);const set=new Set();let amount=0,minutes=0;
  state.goals.forEach(function(g){g.records.forEach(function(r){
    const rd=parse(r.date);if(rd>=parse(ws)&&rd<=we){amount+=r.amount;minutes+=(r.minutes||0);set.add(r.date);}
  });});
  return {amount:amount,days:set.size,minutes:minutes};
}

function pmStep(d){pmViewM+=d;if(pmViewM<1){pmViewM=12;pmViewY--;}else if(pmViewM>12){pmViewM=1;pmViewY++;}}
function pmMonths(){
  let y=pmViewY,m=pmViewM;
  for(let i=0;i<5;i++){m--;if(m===0){m=12;y--;}}
  const out=[];
  for(let i=0;i<6;i++){out.push({y:y,m:m});m++;if(m===13){m=1;y++;}}
  return out;
}
function pmCellBg(r){
  if(r<=0)return '#f2eee8';
  const a=(0.18+0.55*r).toFixed(2);
  return 'rgba(74,222,128,'+a+')';
}
function pmAgg(){
  const map={};
  Object.keys(state.punch.todos).forEach(function(d){
    const mk=d.slice(0,7);
    (state.punch.todos[d]||[]).forEach(function(it){
      const cat=it.cat||'daily';const key=cat+'|'+it.text;
      if(!map[key])map[key]={cat:cat,text:it.text,months:{}};
      if(!map[key].months[mk])map[key].months[mk]={done:0,total:0};
      map[key].months[mk].total++;
      if(it.done)map[key].months[mk].done++;
    });
  });
  const daily=[],work=[];
  Object.keys(map).forEach(function(k){
    const o=map[k];
    (o.cat==='work'?work:daily).push(o);
  });
  return {daily:daily,work:work};
}
// 单个打卡项目近 6 个月完成度柱状图（SVG 手写，无外部依赖）
function pmItemChart(it,months){
  const W=300,H=122,pad=16,axisH=26;
  const n=months.length;
  const gap=Math.max(6,Math.floor((W-pad*2)/n*0.16));
  const bw=(W-pad*2-gap*(n-1))/n;
  const chartH=H-axisH-pad;
  let svg='<svg class="pm-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  svg+='<line x1="'+pad+'" y1="'+(H-axisH)+'" x2="'+(W-pad)+'" y2="'+(H-axisH)+'" stroke="#e2e8f0" stroke-width="1"/>';
  months.forEach(function(mo,i){
    const x=pad+i*(bw+gap);
    const mk=mo.y+'-'+pmPad2(mo.m);
    const cell=it.months[mk];
    const ratio=cell&&cell.total?cell.done/cell.total:0;
    const h=Math.max(3,chartH*ratio);
    const y=(H-axisH)-h;
    if(cell){
      svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+pmCellBg(ratio)+'" title="'+mo.m+'月 '+cell.done+'/'+cell.total+' 天"/>';
      svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="10" fill="#475569">'+cell.done+'</text>';
    }else{
      svg+='<rect x="'+x.toFixed(1)+'" y="'+(H-axisH-3).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="3" rx="2" fill="#eef1f5"/>';
    }
    svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-axisH+15).toFixed(1)+'" text-anchor="middle" font-size="10" fill="#94a3b8">'+mo.m+'月</text>';
  });
  svg+='</svg>';
  return svg;
}
function buildPunchMonthlyStat(){
  const months=pmMonths();
  const agg=pmAgg();
  const cur=new Date();
  const atCur=(pmViewY===cur.getFullYear()&&pmViewM===cur.getMonth()+1);
  let html='<div class="ps-sub">横轴为所选月份往前 6 个月（最右列＝所选月）。点开任意项目，查看该项目每个月完成天数的柱状图——柱越高代表当月完成度越高（含补打卡）。</div>';
  html+='<div class="pm-nav"><button data-action="punch-month-prev">‹ 上月</button><span class="pm-ym">'+pmViewY+'年'+pmViewM+'月</span>'+
    '<button data-action="punch-month-next"'+(atCur?' disabled':'')+'>下月 ›</button>'+
    (atCur?'':'<button data-action="punch-month-today">回到当月</button>')+'</div>';
  if(agg.daily.length===0&&agg.work.length===0){html+='<div class="empty">还没有任何打卡记录。</div>';return html;}
  function group(title,arr){
    if(arr.length===0)return '';
    let g='<div class="pm-group"><div class="pm-gname">'+title+'</div>';
    arr.forEach(function(it,idx){
      const key='pm-'+it.cat+'-'+idx;
      g+=collapsibleCard(esc(it.text),key,!!puStatOpen[key],pmItemChart(it,months));
    });
    g+='</div>';
    return g;
  }
  html+=group('日常打卡',agg.daily);
  html+=group('工作打卡',agg.work);
  return html;
}

function ringSVG(rate,color){
  const r=26,C=2*Math.PI*r,off=C*(1-Math.min(1,rate));
  return '<svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="#eceef5" stroke-width="8"/>'+
    '<circle cx="36" cy="36" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 36 36)"/>'+
    '<text x="36" y="40" text-anchor="middle" font-size="14" fill="#1f2430" font-weight="700">'+Math.round(rate*100)+'%</text></svg>';
}

function boardChart(g){
  const days=[];for(let i=13;i>=0;i--)days.push(fmt(addDays(T,-i)));
  const data=days.map(function(d){
    const min=g.records.filter(function(r){return r.date===d&&r.minutes!=null;}).reduce(function(s,r){return s+(r.minutes||0);},0);
    return {d:d,min:min};
  });
  const max=Math.max(1,data.reduce(function(m,x){return Math.max(m,x.min);},0));
  const W=308,H=130,pad=18,barW=14,gap=(W-pad*2-14*barW)/13;
  let bars='';
  data.forEach(function(x,i){
    const x0=pad+i*(barW+gap);
    if(x.min>0){
      const h=(x.min/max)*(H-pad-10);
      bars+='<rect x="'+x0+'" y="'+(H-pad-h)+'" width="'+barW+'" height="'+h+'" rx="3" fill="'+g.color+'"/>';
    }
    const lbl=(i%2===0)?'<text x="'+(x0+barW/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#8a90a2">'+x.d.slice(5)+'</text>':'';
    bars+=lbl;
  });
  const hasData=data.some(function(x){return x.min>0;});
  return '<div class="chart-title">近 14 天投入分钟（'+esc(g.name)+'）</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+
    '<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#eceef5"/>'+bars+'</svg>'+
    '<div class="chart-note">'+(hasData?'未填分钟数的记录不计入此图。':'近 14 天均无分钟记录。')+'</div>';
}

let weeklyStart=fmt(mondayOf(T));
function weeklyBlock(){
  const cur=weekSummary(weeklyStart);
  const prev=weekSummary(fmt(mondayOf(addDays(parse(weeklyStart),-7))));
  const wnote=state.weekly[weeklyStart]||{keep:'',problem:'',try:'',plan:''};
  function delta(a,b,unit){
    if(b===0)return a===0?'<span class="flat">—</span>':'<span class="up">+'+a+unit+'</span>';
    const d=a-b;const p=Math.round(d/b*100);
    if(d===0)return '<span class="flat">持平</span>';
    return (d>0?'<span class="up">+'+d+unit+' ('+p+'%)</span>':'<span class="down">'+d+unit+' ('+p+'%)</span>');
  }
  const range=weeklyStart.slice(5)+' ~ '+fmt(addDays(parse(weeklyStart),6)).slice(5);
  let html='<div class="sub" style="margin:2px 0 10px">按周一~周日汇总投入，含上周环比与四栏复盘</div>';
  html+='<div class="week-nav"><button class="btn-sm" data-action="week-prev">← 上周</button><span class="wn">'+range+'</span><button class="btn-sm" data-action="week-next">下周 →</button></div>';
  html+='<div class="wsum">'+
    '<div class="s"><div class="v">'+cur.amount+'</div><div class="k">投入量（'+unitHint()+'）</div><div class="d">'+delta(cur.amount,prev.amount,'')+'</div></div>'+
    '<div class="s"><div class="v">'+cur.days+'</div><div class="k">打卡天数</div><div class="d">'+delta(cur.days,prev.days,'天')+'</div></div>'+
    '<div class="s"><div class="v">'+cur.minutes+'</div><div class="k">投入分钟</div><div class="d">'+delta(cur.minutes,prev.minutes,'分')+'</div></div>'+
    '</div>';
  html+='<div class="cols">'+
    '<div class="col"><h4>保持</h4><textarea data-wk="keep" placeholder="这周做得好的">'+esc(wnote.keep)+'</textarea></div>'+
    '<div class="col"><h4>问题</h4><textarea data-wk="problem" placeholder="卡住的地方">'+esc(wnote.problem)+'</textarea></div>'+
    '<div class="col"><h4>尝试</h4><textarea data-wk="try" placeholder="准备试的方法">'+esc(wnote.try)+'</textarea></div>'+
    '<div class="col"><h4>下周预案</h4><textarea data-wk="plan" placeholder="下周打算">'+esc(wnote.plan)+'</textarea></div>'+
    '</div>';
  html+='<div class="week-actions"><button class="btn-primary" data-action="gen-week" style="box-shadow:none">一键生成周报文本</button><button class="btn-ghost" data-action="copy-week">复制</button></div>';
  html+='<div id="weekOut" style="display:none;margin-top:12px;background:#f7f8fc;border:1px solid var(--line);border-radius:12px;padding:13px;white-space:pre-wrap;font-size:13px"></div>';
  return html;
}

（算力、大模型、行业应用、智能终端）确定性受益；消费金融板块（银行零售贷款、消费分期）将获财政补贴加持；服务业经营主体融资成本有望实质下降1个百分点；服务消费（餐饮、文旅、住宿、养老、家政）需求侧激活。","view":"\"双贴息\"是一个被市场低估的创新——把财政资金从\"补供给\"扩展到\"补需求端信贷成本\"，落地后可能比单纯消费券更有效。AI方面，**国企\"开放场景\"是含金量最高的政策**——应用落地的瓶颈从来不在技术，在场景。这一条如果执行到位，对中国AI产业是质变级别的利好。"},{"date":"2026-07-31","keywords":"：政治局会议·发力提效 · 国常会·双贴息 · 人工智能+行动 · PMI新订单断崖 · 中美欧经贸三角 · 三新经济18.39% · 煤电占比首破50%","title":"7月PMI全面跌破荣枯线：新订单暴跌2.7个百分点的\"非季节性\"诊断","what":"据国家统计局7月31日数据，7月制造业PMI 49.2%（降1.1）、非制造业49.0%（降1.2）、综合PMI 49.3%（降1.3），三大指数同时跌破50%——这是近四个月最差成绩单。结构上：制造业新订单指数48.5%，**较上月暴跌2.7个百分点**；非制造业新订单44.4%，降3.6个百分点；建筑业新订单40.1%，**暴跌6.2个百分点**。亮点是高技术制造业PMI 53.3%、装备制造业51.4%仍在扩张区间；企业生产经营活动预期指数54.1%，仍在较高水平。物流信息中心文韬将回落归因于\"高温多雨台风\"等季节性因素；但物流与采购联合会特约分析师张立群明确指出\"内需走弱态势仍很明显……要高度重视并尽快扭转内需走弱态势\"。","why":"这是政治局会议\"加大逆周期调节\"和国常会\"双贴息\"政策**密集出台的最佳注脚**——政策落地的顺序完美对应数据恶化的轨迹。建筑业新订单暴跌6.2个百分点是**最危险的信号**：地产和基建新开工仍在恶化，\"六张网\"7万亿投资能否对冲是下半年最大变量。新订单断崖式下滑说明\"东西卖不动了\"——不是企业不想生产，是真需求出了问题。","gov":"政府在\"数据→政策\"链条上扮演**\"危机响应者\"**。7月30日政治局会议\"加大逆周期调节\"与7月31日国常会\"双贴息\"几乎是无缝衔接——这份数据实际上**已经在政治局会议前被掌握**（统计局通常提前发布解读给决策层），政策密集出台的顺序证明政府对7月数据的\"塌陷\"早有预判。核心恐惧不是增速放缓本身，而是\"需求塌陷→企业减产→裁员降薪→消费更差\"的负反馈螺旋。","impact":"三季度降准降息预期进一步升温（机构普遍预计降准25-50BP）；基建链三季度开工有望明显加速，对冲建筑业新订单下滑；高技术制造业与装备制造业仍是政策\"输血\"重点；消费板块短期承压，等待\"双贴息\"落地。","view":"别用\"季节性\"搪塞——新订单降2.7个百分点不是夏天太热能解释的（去年7月也是高温，PMI并未出现类似断崖）。企业预期指数54.1%说明企业家**还想干**，但**订单没了**。真正的风险点在建筑业——如果地产和基建新开工继续恶化，\"六张网\"投资能否对冲就是下半年最大的胜负手。"},{"date":"2026-07-31","keywords":"：政治局会议·发力提效 · 国常会·双贴息 · 人工智能+行动 · PMI新订单断崖 · 中美欧经贸三角 · 三新经济18.39% · 煤电占比首破50%","title":"何立峰-贝森特视频通话+中欧磋商新定位：中美欧经贸三角重构信号","what":"据新华社7月30日报道，北京时间7月30日晚，中美经贸中方牵头人、国务院副总理何立峰与美方牵头人、美国财政部长贝森特和贸易代表格里尔举行视频通话。双方围绕落实中美两国元首北京会晤重要共识，就下一阶段保持经贸关系稳定、拓展务实合作、妥善解决彼此关切进行了\"坦诚、深入、富有建设性\"的交流。**中方就近期美对华经贸限制措施表达严正关切**。双方同意在两国元首战略引领下进一步发挥好中美经贸磋商机制作用。同日，商务部介绍**中欧贸易投资磋商机制首次会议**成果：双方就**\"稳定、平衡的中欧关键贸易伙伴\"**新定位达成共识，初步商定今年秋季举行磋商机制第二次会议。","why":"一天之内中美、中欧两条主线**同时发出缓和信号**——这在全球贸易格局加速分化、中美科技博弈持续加码的背景下极为罕见。视频通话本身\"中方表达严正关切\"是关键定调——说明双方分歧仍在，但**管控分歧的机制还在运转**。中欧\"稳定、平衡\"的新定位用语**耐人寻味**——稳定是基调，平衡是诉求，说明中欧都不想滑向\"脱钩\"，但也都不想单方面让步。","gov":"政府在这里是**\"多边平衡手\"**。动力来自三个层面：①对美——必须把元首会晤共识\"翻译\"成可执行清单，否则外交成果会空心化；②对欧——中欧关系相对中美的\"避险价值\"上升，需要在欧美之间保持战略腾挪空间；③对内——7月PMI新订单中出口相关分项已有压力（部分高耗能行业生产指数和新订单指数均低于45%），稳定外需是稳增长的现实需要。\"严正关切\"措辞则提醒美方：合作可以，但必须在相互尊重基础上——这是**边握手边划线**。","impact":"中美关税博弈暂时进入\"静默期\"，三季度外贸数据可能边际改善；中欧\"稳定、平衡\"新定位为年底前可能的BIT谈判或中欧投资协定重启创造窗口；A股出口板块（机电、家具、纺织）短期情绪利好；人民币汇率压力阶段性缓解。","view":"这次通话**不是\"握手言和\"，是\"暂停升级\"**。美方对华经贸限制措施仍在加码，中方\"严正关切\"是必须的程序性表态。但更大的信号在中欧——\"稳定、平衡\"这四个字的潜台词是\"我们不跟美国走，但也不想被你绑上战车\"。**中美欧三角的微妙平衡正在被重新校准**，下半年这三条线的外交互动值得持续跟踪。"},{"date":"2026-07-31","keywords":"：政治局会议·发力提效 · 国常会·双贴息 · 人工智能+行动 · PMI新订单断崖 · 中美欧经贸三角 · 三新经济18.39% · 煤电占比首破50%","title":"三新经济占GDP 18.39%+煤电占比首破50%：被低估的\"向新向优\"硬数据","what":"据国家统计局7月31日数据，**2025年我国\"三新\"（新产业、新业态、新商业模式）经济增加值占GDP比重达18.39%**，较上年提高0.38个百分点。同日国家能源局发布数据：**今年上半年我国风电、太阳能发电总量突破1.2万亿千瓦时，约占全社会用电量的四分之一**；煤电发电量为2.5万亿千瓦时，**占比首次低于50%**。这一数据意味着中国电力供给的\"绿色化\"已越过临界点——可再生能源装机与发电的规模优势开始转化为结构性主导。叠加政治局会议\"发展智能经济新形态\"\"深入实施人工智能+行动\"的部署，**\"向新向优\"已不只是口号，而是实打实的结构变化**。","why":"在7月PMI全面跌破荣枯线、需求端疲软的宏观背景下，**这两个数据是\"新动能\"是否真正接棒的关键证据**。三新经济18.39%的占比意味着\"四分之一个中国经济\"已经长出\"新质地\"；煤电占比首破50%则意味着中国电力系统的\"碳锁定\"风险正在被打破——\"双碳\"目标已经从政策承诺变为结构现实。这两条数据为政治局会议\"动能向新、结构向优\"的判断提供了**最硬的注脚**。","gov":"政府在\"新旧动能转换\"中是**\"长期主义的播种者\"**。动力来自三个维度：①国际博弈——CBAM等绿色贸易规则倒逼出口产品必须降低碳足迹，新能源+新业态是出口结构的\"护城河\"；②产业安全——AI算力爆发带来的能耗压力，让\"绿色算力\"成为必须提前布局的赛道；③经济韧性——传统动能（地产、传统基建）已无法支撑5%增速，新动能必须接棒。\"三新经济\"和\"新能源占比\"是政府用**真金白银+制度供给**十余年持续投入的成果，今天终于到了\"开花结果\"的时候。","impact":"新能源产业链（光伏、风电、储能、绿氢、智能电网）结构性增长逻辑被强化；与\"三新经济\"相关的科创板、创业板成长股中长期受益；绿电直连、绿色算力、虚拟电厂等\"新基建+新能源\"交叉领域出现新机会；高耗能行业（化工、有色、建材）面临\"绿色转型成本\"上升压力。","view":"在今天一堆\"坏消息\"（PMI跌破、新订单塌陷）中间，**这条几乎是最重要的\"好消息\"**——它回答了一个根本问题：经济结构到底转过来了没有？答案是\"正在转\"。但要注意，\"三新经济\"18.39%的占比中，**新业态（直播电商、平台经济）贡献很大，新产业（硬科技）的占比仍待提升**。真正的胜负手是\"AI+\"能不能像\"互联网+\"一样，把\"三新\"中的\"新业态红利\"转化为\"新产业红利\"。 **📎 今日关键词**：政治局会议·发力提效 · 国常会·双贴息 · 人工智能+行动 · PMI新订单断崖 · 中美欧经贸三角 · 三新经济18.39% · 煤电占比首破50%"},{"date":"2026-08-01","keywords":"：PMI结构分化、8000亿金融工具、美联储五连停、生态环境法典、集成电路出海","title":"[7月PMI全面回落至荣枯线以下，但高技术制造业PMI逆势站上53.3%]","what":"据国家统计局7月31日数据，7月制造业PMI为49.2%，较上月下降1.1个百分点；非制造业商务活动指数49.0%，综合PMI产出指数49.3%，三大指数同步跌破荣枯线。但高技术制造业PMI达53.3%，装备制造业PMI为51.4%，均保持扩张。","why":"这是\"新动能对冲旧动能\"最直观的月度数据——整体景气下滑，但结构分化加剧。通用设备、计算机通信电子设备等行业产需指数高于53%，而汽车、黑色金属等传统行业低于临界点。","gov":"政府在这里是\"数据发布者+预期管理者\"的双重角色。统计局首席统计师亲自解读、强调\"极端天气+传统淡季\"的季节性因素，是在做预期引导——告诉市场\"别恐慌，这是暂时性的\"。背后的动力很明确：7月30日政治局会议刚定调\"发力提效\"，第二天PMI就跌破荣枯线，如果市场解读为趋势性下滑，会影响三季度政策推进的信心基础。所以官方刻意把高技术制造业53.3%放在C位，用\"结构亮点\"对冲\"总量回落\"的叙事。","impact":"对制造业投资者、周期行业分析师、下半年宏观政策节奏判断有直接参考价值。8月数据能否回升是关键观察窗口。","view":"PMI\"破5\"不可怕，可怕的是新订单指数掉了2.7个百分点——需求端才是真问题，政策重心该往消费端使劲。"},{"date":"2026-08-01","keywords":"：PMI结构分化、8000亿金融工具、美联储五连停、生态环境法典、集成电路出海","title":"[发改委部署下半年八大重点，8000亿政策性金融工具资金加速投放]","what":"7月31日，国家发改委举行上半年发展改革形势通报会及新闻发布会，部署下半年八方面重点工作。核心增量：8000亿元新型政策性金融工具资金加快投放、7550亿元中央预算内投资已基本下达完毕、\"十五五\"算力网建设预计新增直接投资4万亿元，明确提出让民间投资\"放心投、投得动、多参与\"。","why":"这是政治局会议后第一份完整的\"执行清单\"。8000亿金融工具是下半年最大的财政增量弹药，4万亿算力投资是给民间资本画的最大的饼。","gov":"政府在这里是\"规则制定者+投资拉动者+民间资本动员者\"三重叠加。动力链条很清晰：上半年GDP增长4.7%，虽在主要经济体中靠前，但距离全年目标仍有压力；PMI又在下行，内需不足是核心矛盾。政府必须用\"看得见的手\"把投资拉起来——但跟2008年\"四万亿\"不同的是，这次不搞大水漫灌，而是精准投向\"六张网\"（算力网、物流网等）和109项重大工程，同时刻意向民间资本开放，因为单靠财政已经扛不动了。4万亿算力投资\"以企业投资为主\"这句话，本质是在说：政府搭台、企业唱戏、你出钱。","impact":"基建产业链、算力基础设施企业、民间投资准入政策关注者、下半年专项债发行节奏。","view":"4万亿算力投资的饼很大，但\"企业投资为主\"意味着谁来买单还没定——民间资本愿不愿意跟，取决于算力回报率能不能算过账来。"},{"date":"2026-08-01","keywords":"：PMI结构分化、8000亿金融工具、美联储五连停、生态环境法典、集成电路出海","title":"[美联储\"五连停\"维持利率3.5-3.75%，3票反对凸显内部分歧，9月加息预期拉满]","what":"北京时间7月30日凌晨，美联储FOMC以9票赞成、3票反对维持联邦基金利率3.5%-3.75%不变，连续第五次按兵不动。3位委员主张加息25个基点，为近年来最大分歧。主席沃什拒绝使用\"暂停\"一词，市场已完全消化9月加息预期。美股尾盘跳水，道指跌超1100点。","why":"美联储内部分歧从\"温和分歧\"升级到\"3票反对\"，意味着加息天平正在倾斜。如果9月真的加息，人民币汇率和资本流动将面临新一轮压力。","gov":"美联储在这里扮演\"全球流动性的总开关\"角色。沃什的处境很有意思——他本人被市场认为偏鸽，但3票反对票来自鹰派委员，他不得不在\"维持不变\"和\"被认为软弱\"之间走钢丝。背后的核心动力是通胀黏性：美国CPI仍在3.5%，能源价格因中东冲突居高不下，供应冲击让2%目标遥遥无期。特朗普公开说\"沃什想降息但身不由己\"，这句话既是给沃什台阶下，也是在向委员会施压——但3票反对说明，政治压力在美联储内部并不好使。对中国而言，美联储如果9月加息，中美利差将进一步走阔，人民币贬值压力回升，央行降息空间被压缩。","impact":"汇率市场、跨境资本流动、央行货币政策空间、A股外资流向、黄金价格走势。","view":"沃什说\"不叫暂停\"——这话本身就是最大的信号。他不是在说\"可能加息\"，而是在为加息做心理铺垫。"},{"date":"2026-08-01","keywords":"：PMI结构分化、8000亿金融工具、美联储五连停、生态环境法典、集成电路出海","title":"[8月1日起一批重磅新规施行：生态环境法典、个人贷款明示成本、医药代表管理]","what":"8月1日起多项全国性法规规章正式施行。其中：《个人贷款业务明示综合融资成本规定》要求放贷机构向借款人展示\"综合融资成本明示表\"，逐项列清所有息费并承诺不再额外收取；《医药代表管理办法》严禁医药代表承担销售任务、输送回扣；《新能源汽车维修作业安全要求》国标实施；8月15日起《生态环境法典》——继民法典后我国第二部法典——正式施行，同步废止10部法律。","why":"这不是零散新规，而是一组\"补短板\"的系统性立法——金融消费者保护、医药反腐、生态法治、新能源安全，四个方向同时落地。","gov":"政府在这里是\"规则制定者+市场秩序裁判者\"。四部新规背后是四条不同的动力线：个人贷款明示成本，动力来自消费贷款贴息政策需要配套——国常会刚用财政资金给消费贷贴息，如果放贷机构还在搞隐性收费，贴息的钱就被中间环节吃掉了，政策效果打折扣；医药代表管理，动力来自医疗反腐的延续——把回扣链条从制度上切断；生态环境法典，动力来自\"十五五\"绿色转型的法治化需求——把分散在10部法律里的规则整合成一部法典，本质是给地方政府和企业一本\"统一的环保说明书\"；新能源维修国标，动力来自新能源汽车保有量爆发后的安全风险倒逼。四部新规的共同逻辑是：产业发展到一定阶段，规则必须跟上。","impact":"银行业个贷业务合规成本、医药行业学术推广模式、新能源汽车后市场、环保执法力度。","view":"个人贷款\"明示成本\"看起来是小事，但可能是下半年消费金融的关键变量——如果隐性收费被堵死，实际贷款成本可能不降反升。"},{"date":"2026-08-01","keywords":"：PMI结构分化、8000亿金融工具、美联储五连停、生态环境法典、集成电路出海","title":"[中国智造全面出海：集成电路出口上半年增88.7%，人形机器人产量占全球半数]","what":"据工信部7月20日发布数据及央视7月30日报道，今年上半年我国集成电路出口额同比增长88.7%，对商品出口总额增长贡献接近三分之一；人形机器人整机产品达400余款、超全球半数，四足机器人占全球销量近70%。AI算力相关光通信设备出口增长22.3%，3D打印机出口增长109.3%，智能仿生机器人出口已超万台。","why":"这不是单点突破，而是\"从算力底座到终端应用\"的全链条出海。中国出口结构正在从\"衣服玩具\"切换到\"芯片风机机器人\"——装备工业对出口增长贡献率接近五成。","gov":"政府在这里是\"产业政策设计者+国际市场开拓者\"。动力来自两条线：一是经济转型的硬压力——传统劳动密集型出口增长见顶，必须有新的出口支柱接力；二是国际博弈的软动力——在美国对华技术封锁背景下，用出口实绩证明\"中国制造不可替代\"，是对封锁最有力的回应。发改委同时宣布加快人工智能法立法进程，一方面要管住风险，另一方面也是在给国际市场释放信号：中国AI产业有规则、有秩序、可信赖。但值得注意的张力是：出口越是火爆，越容易引发贸易伙伴的反弹——美方一边谈300亿美元对等降税，一边又对华加征关税，就是这种矛盾心态的体现。","impact":"半导体产业链、机器人产业链、跨境电商、外贸企业、国际经贸谈判筹码。","view":"集成电路出口增88.7%这个数字太亮眼了，但亮眼到需要警惕——增长基数效应+AI算力需求脉冲，下半年能否持续是真正的考验。 **📎 今日关键词**：PMI结构分化、8000亿金融工具、美联储五连停、生态环境法典、集成电路出海"},{"date":"2026-08-04","keywords":"：新型电力系统 · 芯片知识产权保护 · 离岸人民币国债期货 · 可再生能源强制消纳 · 日美汇市干预","title":"两部门发布《新型电力系统建设\"十五五\"规划》：2030年非化石能源发电占比过半","what":"8月3日，国家发展改革委、国家能源局印发《新型电力系统建设\"十五五\"规划》，提出到2030年初步建成新型电力系统，非化石能源发电量占比达50%，实现28亿千瓦以上新能源高水平消纳，建成支撑超1.1亿辆电动汽车的充电网络，新型储能规模达3亿千瓦。","why":"这是未来五年电力投资的\"总施工图\"。2026上半年可再生能源发电占比首超四成、煤电占比首破50%，能源结构拐点已现，规划把拐点变成硬约束。","gov":"政府既是\"规则制定者\"（定非化石占比、消纳底线），又是万亿级基建的\"市场参与者\"。动力来自三重压力：能源安全（油气对外依存）、双碳承诺的硬考核、为AI算力与电动车爆发式用电\"提前铺路\"。本质是用国家规划锁定长期投资预期，避免新能源\"建得起、送不出、用不掉\"。","impact":"电网设备、储能、充电运营商、虚拟电厂迎长期确定性订单；高耗能企业用电成本与绿电配额约束上升。","view":"能源转型从\"拼装机\"进入\"拼系统\"，谁搞定调节能力与电网柔性，谁吃下一个十年红利。"},{"date":"2026-08-04","keywords":"：新型电力系统 · 芯片知识产权保护 · 离岸人民币国债期货 · 可再生能源强制消纳 · 日美汇市干预","title":"国务院修订《集成电路布图设计保护条例》：25年来首次全面大修，10月15日施行","what":"国务院总理李强签署第842号国务院令，公布修订后的《集成电路布图设计保护条例》，自2026年10月15日起施行。共6章54条，扩展保护范围（纳入光子、量子芯片）、完善登记审查、加大侵权惩罚性赔偿、明确布图设计可作价质押融资。","why":"这相当于给芯片内部电路图立\"版权法\"，是国产芯片创新的底层法治基石。外部技术管制越紧，内部产权保护越要硬。","gov":"政府是\"裁判者+规则制定者\"。动力很直白——半导体是中美博弈的命门，光有产能不够，得让企业\"敢投研发、不怕被抄\"。把布图设计变成可交易、可融资的知识产权资产，等于给国产EDA和芯片设计公司发了\"定心丸\"和\"融资凭证\"。","impact":"利好国产EDA、芯片设计公司；抬高反向工程与侵权抄袭成本；光子/量子芯片获明确法律身份。","view":"硬科技竞争，最终拼的是\"创新—确权—变现\"的闭环，这一步补的是闭环里最虚的那块。"},{"date":"2026-08-04","keywords":"：新型电力系统 · 芯片知识产权保护 · 离岸人民币国债期货 · 可再生能源强制消纳 · 日美汇市干预","title":"离岸首只！5年期人民币国债期货在港交所上市","what":"8月3日，5年期人民币国债期货在港交所正式挂牌，是离岸市场唯一以中国国债为基准的场内利率期货，首日成交3755张合约，13家做市商护航。当前国际投资者持有中国债券已达3.2万亿元。","why":"补上了离岸人民币固收\"现券投资—场外对冲—场内风险管理\"链条的最后一环，外资持有中国国债有了标准化\"减震器\"。","gov":"内地与香港监管是\"协同开放者\"。动力双向：对外，给3.2万亿外资持仓提供利率对冲工具，让\"外资更放心持有中国债券\"；对内，把香港从投融资中心升级为定价、风险管理、资产配置\"枢纽\"，巩固离岸人民币桥头堡。这是\"一国两制\"下金融制度型开放的一步棋。","impact":"提升中国债券对外资吸引力；丰富离岸人民币使用场景；利好港交所及跨境券商、做市商。","view":"人民币国际化不靠喊，靠离岸市场\"工具密度\"——每多一个人民币计价的硬品种，就多一层沉淀资金的能力。"},{"date":"2026-08-04","keywords":"：新型电力系统 · 芯片知识产权保护 · 离岸人民币国债期货 · 可再生能源强制消纳 · 日美汇市干预","title":"中国开启可再生能源\"强制消纳\"时代：绿色消费从倡导变企业硬义务","what":"8月1日起，《可再生能源消费最低比重目标和可再生能源电力消纳责任权重制度实施办法》（2026年第42号令）施行，首次建立可再生能源消费最低比重目标制度，把消纳责任从地方政府、电网下沉到重点用能行业和企业。同期，工信部等三部门首次启动\"碳效领跑者\"企业遴选。","why":"过去新能源矛盾在\"供给端接不进电网\"，现在转向\"消费端用不用绿电\"——政策从\"供给推动\"转向\"需求牵引\"。","gov":"政府是\"刚性义务设定者\"。动力在于：风光装机已巨量，但重点行业若仍以传统能源组织生产，绿色电力就变不成产业低碳竞争力。用企业\"谁消费、谁担责\"的义务反向稳定新能源投资预期和绿电需求，把双碳宏观目标拆成可考核的硬指标。","impact":"钢铁、化工、有色等高耗能行业绿电采购与碳成本压力上升；绿电交易、碳管理服务迎需求。","view":"强制消纳是双碳真正\"动真格\"的信号——从前是鼓励你绿，现在是要求你绿。"},{"date":"2026-08-04","keywords":"：新型电力系统 · 芯片知识产权保护 · 离岸人民币国债期货 · 可再生能源强制消纳 · 日美汇市干预","title":"时隔15年，日美再次联合干预汇市","what":"日本财务大臣片山皋月8月3日声明，日本已于美东时间7月31日与美国联合干预外汇市场，且不排除追加干预。这是日美时隔15年再度联手进场。","why":"两大发达经济体公开联手\"护盘\"汇率，说明汇率博弈已从口头协调升级为实质干预，全球资本流动的不确定性升温。","gov":"美日政府在此扮演\"市场直接参与者/裁判员\"。动力各取所需：日本苦于日元过度波动冲击出口与企业盈利，要稳汇率；美国在其自身利率与美元走势框架下默许甚至配合盟友稳定汇率秩序。本质是大国在\"汇率—贸易—利率\"三角里互相试探底线。","impact":"日元、美元及亚洲货币波动加大；出口型企业和跨境资金需重新评估汇率风险；对人民币离岸环境亦有外溢。","view":"当主要经济体亲自下场买卖汇率，说明\"自由浮动\"的叙事正在让位于\"管理浮动\"的现实。 **📎 今日关键词**：新型电力系统 · 芯片知识产权保护 · 离岸人民币国债期货 · 可再生能源强制消纳 · 日美汇市干预"},{"date":"2026-08-05","keywords":"：流动性净投放 · 中美关税暂缓 · 财政金融协同扩内需 · 新兴支柱产业 · 全国统一大市场","title":"央行8月5日加量续做5000亿买断式逆回购，净投放2000亿","what":"8月4日央行公告，8月5日开展5000亿元3个月期买断式逆回购（92天），本月有3000亿到期，净投放2000亿元，连续第二个月加量续做。8月中长期到期流动性约1.9万亿（含6000亿MLF、1万亿6个月买断式、3000亿3个月买断式），叠加政府债净融资预计2.77万亿，资金面缺口显著扩大。","why":"这是央行下半年\"适度宽松+保持流动性充裕\"基调的即时落地，把7月工作会议\"适时调整工具\"的表态变成了动作。","gov":"央行是\"流动性守门人\"。动力很实在——8月是税期、缴款高峰、政府债放量的三重叠加，若不加量，短端利率可能大幅偏离政策利率，进而抬高实体融资成本。本质是用基础货币的确定性，给财政加力（2.77万亿政府债净融资）铺路，体现财政货币协同稳预期。","impact":"债市利率平稳、银行信贷投放更有底气；关注后续是否降准降息。","view":"央行把\"保持充裕\"写进操作里而非只挂嘴上，这是给市场的一颗定心丸。"},{"date":"2026-08-05","keywords":"：流动性净投放 · 中美关税暂缓 · 财政金融协同扩内需 · 新兴支柱产业 · 全国统一大市场","title":"中美斯德哥尔摩经贸会谈：24%对等关税再暂缓90天，延至11月12日","what":"8月3日商务部公布7月28-29日中美斯德哥尔摩经贸会谈联合声明，双方同意将已暂停的美方对等关税24%部分及中方反制措施如期展期90天，美方对华关税暂缓期延至今年11月12日（日内瓦以来第三次延期）。但会谈前一周，美方连发三道限制：7/23对60个经济体征301关税（对华12.5%）、7/28 FCC将外国产先进机器人/逆变器列入管制清单、7/29制裁8家涉伊航运企业。","why":"\"边谈边压\"成新常态。关税暂缓给了谈判窗口，同期制裁升级说明美方把关税、科技、航运三线同时当筹码。","gov":"中方是\"谈判者+反制者\"双重身份——既不愿贸易战全面复燃（关税恢复则出口承压）所以同意延期换时间，又对美方\"一边要稀土、一边加制裁\"留了一手（7/30视频通话表达严正关切、未做实质让步）。美政府多重身份叠加，本质是用极限施压迫使中方在稀土供应、美农产品采购上让步。","impact":"出口链（机电、轻工）暂获喘息；稀土、机器人、逆变器企业面临长期管制风险。","view":"90天暂停不是和解，是\"停火待谈\"——真正大戏在11月前，稀土和农产品这两个美方最急的诉求能谈出什么。"},{"date":"2026-08-05","keywords":"：流动性净投放 · 中美关税暂缓 · 财政金融协同扩内需 · 新兴支柱产业 · 全国统一大市场","title":"多部门部署下半年\"财政金融协同扩内需\"更大力度举措","what":"据新华财经8月5日报道，多部门明确下半年\"以更大力度、更实举措有效扩大国内需求\"。中央财政安排1000亿元促内需一揽子六项政策（四项定向支持民间投资、两项支持居民消费），通过财政贴息撬动；上半年新发放相关领域中小微企业贷款、设备更新贷款、服务业贷款、个人消费贷款合计超17万亿元，同比+4.6%；两项促消费政策惠及居民消费约1.31万亿元、约9900万人次享贴息红利。发改委将加快8000亿新型政策性金融工具投放、加快专项债发行。","why":"这是政治局会议\"优化实施财政金融协同促内需政策\"的具体化，从\"单兵作战\"转向\"财政贴息+央行再贷款\"的组合拳。","gov":"政府是\"双重操盘手\"——财政部出钱（贴息、1000亿、1.3万亿超长期特别国债），央行出流动性（再贷款、保持充裕）。动力来自二季度内需指标走弱，单靠某一政策边际效用递减、传导堵点多，于是选\"财政信用支持+金融资金配置\"联动，精准撬动民间投资和居民消费。","impact":"设备更新、服务业、消费信贷受益；关注\"两重\"\"两新\"资金落地节奏。","view":"政策工具箱从\"撒胡椒面\"转向\"贴息+再贷款\"的杠杆玩法，花更少的财政钱撬动更大的社会需求，是当下最务实的稳增长路径。"},{"date":"2026-08-05","keywords":"：流动性净投放 · 中美关税暂缓 · 财政金融协同扩内需 · 新兴支柱产业 · 全国统一大市场","title":"政治局会议首提\"新兴支柱产业\"，六大产业2030剑指10万亿","what":"据第一财经等8月3日报道，7月政治局会议在部署下半年经济工作时首次提出\"着力打造新兴支柱产业\"。六大新兴支柱产业（集成电路、航空航天、生物医药、低空经济、新型储能、智能机器人）2025年产值已近6万亿元，预计2030年有望翻番至10万亿以上。表述从\"培育\"升级为\"着力打造\"，资源倾斜将更强。","why":"新兴产业定位从\"增长点\"升级为\"支柱\"，意味着AI、集成电路等不再是补充，而是经济结构的主干，是新动能转换的关键落子。","gov":"政府是\"产业总设计师+资源调配者\"。动力有双重：传统动能（地产、旧基建）放缓需新支柱撑起量与质；同时这是国际科技博弈的\"胜负手\"——谁先形成万亿级新兴产业集群，谁掌握下一轮竞争主动权。所以政策从\"鼓励\"变\"举国打造\"，央企国企带头开放应用场景加速技术落地。","impact":"集成电路、低空经济、新型储能、智能机器人赛道迎确定性政策与资本红利。","view":"\"培育\"变\"打造\"，一字之差是资源投入量级的天壤之别——未来五年这六大产业就是产业政策主战场。"},{"date":"2026-08-05","keywords":"：流动性净投放 · 中美关税暂缓 · 财政金融协同扩内需 · 新兴支柱产业 · 全国统一大市场","title":"全国统一大市场\"组合拳\"：一个条例+三张清单+三项制度，整治\"内卷式\"竞争","what":"8月5日中国政府网刊发发改委解读，全国统一大市场建设进入\"纵深推进关键阶段\"，将打出\"一个条例、三张清单、三项制度\"组合拳——\"一个条例\"即全国统一大市场建设条例；\"三张清单\"为妨碍统一大市场事项清单、地方财政补贴负面清单、地方政府招商引资鼓励和禁止事项清单；\"三项制度\"为市场统一的统计、财税、考核制度。同时综合用产能调控、标准引领、价格执法、质量监管整治\"内卷式\"低价竞争，深化招投标乱象整治。","why":"这是给地方政府的\"经济促进行为\"划红线也划跑道——既明确\"不能做什么\"，也讲清\"可以做什么\"，直指地方保护、补贴内卷、招商恶性竞争。","gov":"中央政府在此是\"规则统一者+裁判员\"。动力：地方间\"内卷式\"竞争（低价抢企业、财政补贴比拼、市场分割）既浪费资源又阻碍统一市场形成，长期削弱经济效率。中央用制度把\"野蛮生长\"收编为\"有序竞争\"，既破壁垒也保公平，为\"大市场→强国内循环\"打地基。","impact":"地方招商补贴模式生变；低价无序竞争企业承压；医疗检查检验结果互认、社保转移接续等民生便利化提速。","view":"统一大市场不是\"削藩\"，是给地方政府立规矩——把\"内卷抢跑\"变成\"同场竞技\"，是中国超大规模市场真正变现的关键一步。 **📎 今日关键词**：流动性净投放 · 中美关税暂缓 · 财政金融协同扩内需 · 新兴支柱产业 · 全国统一大市场"},{"date":"2026-08-06","keywords":"：六张网 · 智能体治理 · 中小企业数字化 · 中美经贸机制化 · 具身智能","title":"\"六张网\"从规划图转施工图，2026年投资或超7万亿","what":"据证券时报8月6日报道，水网、新型电网、算力网、新一代通信网、城市地下管网、物流网\"六张网\"建设下半年集中提速；发改委估算2026年相关投资将超7万亿元，超六成工作量将在下半年兑现。","why":"政治局7月30日会议把\"六张网\"列为扩内需发力点，直接撬动建筑、电力设备、光通信、冷链物流上游订单，并为9—10月施工黄金期注入实物工作量。","gov":"政府是\"总设计师+最大发包方\"双重身份。动力来自投资端稳增长——上半年有效投资需求偏弱，需用7万亿级实物工作量托底GDP；同时\"六张网\"兼顾补短板与锻长板，是新旧动能转换抓手。","impact":"基建、电力设备、光通信、储能、工业软件产业链受益；施工与运维就业回暖。","view":"钱已就位（专项债+超长期国债+8000亿政策性金融工具超3万亿），真正考验是跨网协同的\"软建设\"能否跟上。"},{"date":"2026-08-06","keywords":"：六张网 · 智能体治理 · 中小企业数字化 · 中美经贸机制化 · 具身智能","title":"三部门《智能体规范应用与创新发展实施意见》解读升温","what":"国家网信办、发改委、工信部联合印发的《智能体规范应用与创新发展实施意见》（落实国务院\"人工智能+\"行动意见）近期由新华社《瞭望》8月4日深度解码，首次给出智能体官方定义，圈定19个典型应用场景。","why":"智能体从\"能聊\"走向\"能干\"，自主决策带来网络攻击等真实风险；文件把\"安全可控\"摆首位，同时划定19个落地场景，标志AI进入\"规范快跑\"阶段。","gov":"政府是\"规则制定者+裁判者+生态组织者\"三重身份。动力在于既要抢占智能体产业全球高地，又要防范自主智能体被诱导实施攻击等系统性风险——先把笼子扎好，再让鸟飞起来。","impact":"AI应用开发商、软件商店/分发平台、政务金融医疗智能体服务商需建合规与安全体系；利好安全评测、可信认证赛道。","view":"治理框架越清晰，产业越敢投——这是给狂飙的智能体发的\"准生证+行驶证\"。"},{"date":"2026-08-06","keywords":"：六张网 · 智能体治理 · 中小企业数字化 · 中美经贸机制化 · 具身智能","title":"工信部发布\"小快轻准\"数字化产品培育指引","what":"工信部8月4日公布《\"小快轻准\"数字化产品和服务培育指引（2026年版）》，\"小快轻准\"即小型化、快速化、轻量化、精准化，引导服务商围绕中小企业痛点提供适配产品，并要求深度融合AI、杜绝隐性收费与捆绑销售。","why":"中小企业数字化转型长期卡在\"用不起、不会用、不通用\"，指引建\"优质资源池\"降低选型与试错成本，把惠企政策从口号落到产品层。","gov":"政府是\"服务提供者+规则引导者\"。动力来自保中小企业活力——它们是就业和民间投资主力，但数智化鸿沟在拉大；政府用标准与资源池降低试错风险，本质是\"扶上马送一程\"。","impact":"SaaS与工业互联网服务商、地方数字化转型促进中心迎政策红利；广大中小微制造企业降本提质有抓手。","view":"方向对，落地看地方细则——\"小快轻准\"能否真轻量化，取决于服务商被激励而非被考核。"},{"date":"2026-08-06","keywords":"：六张网 · 智能体治理 · 中小企业数字化 · 中美经贸机制化 · 具身智能","title":"中美经贸\"机制化\"信号：贸易投资委员会+300亿降税框架成形","what":"据商务部7月31日新闻发布会，中美正就\"贸易和投资委员会\"的结构、职能密切沟通，并探讨覆盖双方各300亿美元商品的互降关税框架；同期美方一周三道制裁（301关税、FCC机器人逆变器管制、航运制裁）仍在施压。","why":"博弈从\"临时休战\"转向\"常设机制\"——既设常态化谈判桌，又保留制裁筹码，\"边谈边压\"成新常态。","gov":"中方政府是\"谈判对手+规则制定者+产业守护者\"叠加身份。动力是稳住全球第二大双边贸易体量——彻底脱钩谁都扛不住，所以一边用磋商机制管控冲突，一边用反制守住发展权红线。","impact":"出口制造、农产品与波音采购链、稀土与关键矿产供应链需做\"谈判反复\"预案；AI芯片、机器人、逆变器受管制外溢影响。","view":"机制化是好事，但美方\"左手制裁右手谈判\"套路未变，企业别把90天暂缓当永久免战牌。"},{"date":"2026-08-06","keywords":"：六张网 · 智能体治理 · 中小企业数字化 · 中美经贸机制化 · 具身智能","title":"中国AI与具身智能\"产品+资本\"双线突破","what":"8月5—6日，字节跳动原生音视频全双工大模型SeedRealtime在豆包全量上线；京东开源自研实时流式视频编辑模型JoyAI-Video-Edit；宇树科技科创板IPO启动询价，拟募资42亿元、市值或超400亿。","why":"从\"对话工具\"到\"全能AI伴侣\"、从内容生成到物理世界操控，国产大模型密集从实验室走向产品与资本市场，具身智能站上风口。","gov":"","impact":"","view":"技术爆发不难，难的是把Demo变成持续付费的产品——今年看点不在谁参数大，而在谁先跑通商业闭环。（注：本条为科技商业动态，不强行分析政府角色） **📎 今日关键词**：六张网 · 智能体治理 · 中小企业数字化 · 中美经贸机制化 · 具身智能"},{"date":"2026-08-08","keywords":"：外贸30万亿 · 反内卷 · 跨境资金便利化 · AI硬件终端 · 全民健身","title":"海关总署：前7月外贸首破30万亿，高技术成主引擎","what":"发生了什么：8月7日海关总署公布，前7月货物贸易进出口30.13万亿元、同比+17.3%，历史同期首破30万亿；7月单月+19.2%。高技术产品出口+50%以上，贡献近六成出口增量；电动汽车、锂电池连续17个月双位数增长。","why":"为什么值得关注：外需变乱交织下\"逆风提速\"，动能正从\"成本优势\"换锚到\"技术附加值\"——机电出口占比升至63.8%，出口竞争力在变锚。","gov":"政府角色与动力：政府是\"数据发布者\"兼\"主动开放者\"——已对63国零关税，进口增速（+22%）快于出口8个百分点，用扩大进口平衡贸易、缓释摩擦。动力在稳预期：用硬数据对冲\"外需走弱\"叙事，向市场和谈判对手展示韧性。","impact":"可能影响：芯片、机器人、新能源出海企业；印证\"新质生产力\"主线，对出口型企业经营与资产配置有参考。","view":"我的看法：30万亿是量的验证，真正的看点是\"价升\"——出口拼技术这条线还会延续。"},{"date":"2026-08-08","keywords":"：外贸30万亿 · 反内卷 · 跨境资金便利化 · AI硬件终端 · 全民健身","title":"多晶硅八巨头签\"反内卷\"倡议：不低于成本价卖","what":"发生了什么：8月6日晚，通威、协鑫、大全、新特等8家（占有效产能超90%）在上海签《反内卷倡议书》，承诺售价不低于成本核算成本，主动出清高耗能落后产能。","why":"为什么值得关注：光伏价格战打到逼近现金成本线，这是\"反内卷\"从中央部署落到行业自律的标志性动作，而且第一次有了可量化的\"成本标尺\"。","gov":"政府角色与动力：政府是\"裁判+规则供给者\"——不直接下令限价，而是三件套托底：7/27《光伏行业成本核算模型通则》给\"成本标尺\"、7/31市场监管总局盐城价格合规指导、7/2三项强制国标逼产能出清。动力是落实政治局\"整治内卷式竞争\"，救一个严重失血的支柱产业。","impact":"可能影响：新能源产业链（硅料/组件/储能）利润修复预期；高耗能产能加速退出，利好头部企业与绿电消纳。","view":"我的看法：有标尺、有惩戒、有共识，比历次\"限产保价\"更扎实，但供过于求未解，拐点要看真退出。"},{"date":"2026-08-08","keywords":"：外贸30万亿 · 反内卷 · 跨境资金便利化 · AI硬件终端 · 全民健身","title":"外汇局发布国内外汇贷款新规，10月1日施行","what":"发生了什么：国家外汇管理局近期发布《关于进一步完善国内外汇贷款外汇管理有关事项的通知》，完善账户体系、简化结购汇、取消购汇偿还行政许可，10月1日起施行。","why":"为什么值得关注：把分散的外汇贷款规则一次性整合，从\"单点修补\"升级为跨境结算便利化制度突破，直接利好中小微外贸企业融资效率。","gov":"政府角色与动力：政府是\"规则制定者\"兼\"稳外贸操盘手\"。面对外部经贸复杂、供应链重构，用\"降成本+提效率\"双招为外贸企业减负、畅通双循环堵点；同时强化事中事后监管防风险——放管结合。","impact":"可能影响：有出口背景的制造企业、外贸服务商；跨境资金周转更快、币种选择更灵活。","view":"我的看法：稳外贸从\"退税降息\"延伸到\"跨境资金便利化\"，政策工具箱越来越细。"},{"date":"2026-08-08","keywords":"：外贸30万亿 · 反内卷 · 跨境资金便利化 · AI硬件终端 · 全民健身","title":"全球AI竞赛卷向硬件与终端（OpenAI音箱、英伟达、Anthropic造芯）","what":"发生了什么：8月7日多则消息：OpenAI首款AI智能音箱（iPhone设计之父Jony Ive操刀）定价300-400美元、2027年发售；英伟达测试降显存Rubin Ultra应对HBM短缺；Anthropic首次确认自研Claude芯片；马斯克联手特斯拉启动168亿美元Terafab芯片厂。","why":"为什么值得关注：大模型竞争从\"参数与API\"下沉到\"终端入口+底层算力\"，头部玩家集体向上游硬件卡位，AI军备竞赛进入软硬一体阶段。","gov":"","impact":"可能影响：AI终端（音箱/穿戴/机器人）、先进封装与HBM、芯片代工链条；国内大模型与硬件协同值得跟踪。","view":"我的看法：当OpenAI都开始做硬件，说明\"入口之争\"已白热化，下一波机会在端侧AI。 （本条为国际科技商业动态，非境内经济类政策，按规则不做政府角色分析）"},{"date":"2026-08-08","keywords":"：外贸30万亿 · 反内卷 · 跨境资金便利化 · AI硬件终端 · 全民健身","title":"国务院印发《全民健身计划（2026—2030年）》","what":"发生了什么：8月8日（第18个全民健身日）国务院印发计划，提出到2030年经常锻炼人数比例达40%左右、人均体育场地面积4㎡左右，推进\"15分钟健身圈\"。","why":"为什么值得关注：把\"健康中国\"落到可考核的硬指标，从\"健身去哪儿\"转向\"去哪儿健身\"，体育公共服务与体育消费同步扩容。","gov":"政府角色与动力：政府是\"规则制定者+公共资源组织者\"——靠财政与规划新增体育公园、社区中心、盘活边角地。动力在应对慢病与老龄化、培育健康消费新场景。","impact":"可能影响：体育用品、运动康复、健康生活方式相关消费（含芳疗、睡眠、疗愈等情绪健康赛道）；\"健康生活\"成主流叙事。","view":"我的看法：40%目标背后是\"预防式健康\"崛起，健康消费会从治疗转向日常养护。 **📎 今日关键词**：外贸30万亿 · 反内卷 · 跨境资金便利化 · AI硬件终端 · 全民健身"},{"date":"2026-08-09","keywords":"：可再生能源强制消纳 · 北京楼市松绑 · 平台数据分级监管 · 未来产业政府基金 · 就业优先国家战略","title":"可再生能源\"强制消费\"时代开启：消纳责任权重办法近期施行","what":"国家发改委、能源局印发的《可再生能源消费最低比重目标和可再生能源电力消纳责任权重制度实施办法》近期施行。首次把\"消费最低比重\"从统计监测升级为强制性考核，要求电解铝、钢铁、水泥、多晶硅、新建数据中心等重点用能行业达标；并首次将绿氢、绿氨、绿醇等非电消费纳入考核。截至6月底，可再生能源装机24.55亿千瓦，占总装机60.7%，但\"发得出、用不好\"的矛盾突出。","why":"过去十年重心在\"多发电\"，现在转向\"必须用\"。这是碳达峰碳中和从供给侧扩张转向消费侧硬约束的关键一跃，直接重塑用电企业的成本结构和绿电交易逻辑。","gov":"政府是\"规则制定者+强制考核者\"。动力来自一个尴尬现实——风光装机狂飙，但三北地区弃风弃光、新能源企业\"增发不增收\"，绿电在市场中议价能力弱。单纯靠补贴和装机指标已推不动，必须用法定义务把\"绿色消费需求\"变成真实购买力，既保双碳进度，也护住新能源产业现金流。","impact":"高耗能行业被迫加大绿电采购；倒逼\"三北\"绿电跨区域消纳；对绿电交易、碳市场、新能源运营商是长期利好。","view":"从\"鼓励你用\"到\"必须你用\"，能源转型进入硬约束阶段，用电大户的绿色成本要开始实打实计入账本了。"},{"date":"2026-08-09","keywords":"：可再生能源强制消纳 · 北京楼市松绑 · 平台数据分级监管 · 未来产业政府基金 · 就业优先国家战略","title":"北京房地产再松绑：非京籍五环内购房社保降至1年，公积金额度大涨","what":"8月7日晚，北京三部门联合印发通知，非京籍家庭购买五环内住房的社保/个税缴纳年限由2年调减为1年，全市统一为1年，多子女家庭可额外多购1套。公积金贷款额度大幅提升：单人首套120万、夫妻双方240万，多子女可再上浮100万元。同日，国常会修订的《住房公积金管理条例》也在落地——27年来首次大修，提取范围扩至装修、物业费等。","why":"北京是全国楼市风向标，这次是核心城区（五环内）实质性松绑，叠加公积金额度跳涨，是\"因城施策\"里信号最强的一次。","gov":"政府是\"逆周期调节者+稳预期操盘手\"。动力很直接——房地产供求关系已发生重大变化，库存和预期双弱，地方要守住\"止跌回稳\"底线。北京的算盘：用核心区购房资格撬动真实改善需求，用公积金放大杠杆，既托底又避免全面放开炒作，属于\"精准滴灌\"而非\"大水漫灌\"。","impact":"对刚需和改善型家庭是实质利好；一线城市若跟进，可能带动全国楼市情绪；建材、家居、中介链条受益。但政策目标仍是\"稳\"不是\"涨\"。","view":"尺子收得很巧——只松核心区资格+提公积金额度，既给市场输血，又没松开\"房住不炒\"的缰绳。"},{"date":"2026-08-09","keywords":"：可再生能源强制消纳 · 北京楼市松绑 · 平台数据分级监管 · 未来产业政府基金 · 就业优先国家战略","title":"大型平台个人信息保护新规征求意见：管的是\"处理1000万人以上\"的巨头","what":"国家网信办8月7日将前期两份征求意见稿整合完善为《大型个人信息处理者个人信息保护规定（征求意见稿）》，向社会公开征求意见。新规明确：处理1000万人以上自然人个人信息、或业务对国家安全/经济运行/社会稳定有重要影响的平台，将被认定为\"大型个人信息处理者\"，须设立个人信息保护监督委员会。","why":"这是把\"超大型平台\"从普通监管对象里单独拎出来、配上专门治理架构，数据治理从\"普遍规范\"走向\"分级盯防\"。","gov":"政府是\"裁判者+规则供给者\"。动力来自一个两难——平台手握海量数据，既是数字经济的燃料，也是隐私泄露、算法滥用、数据跨境风险的高危点。监管逻辑不是\"打死平台\"，而是\"给巨头套上缰绳\"：既要保住数据要素市场活力，又要守住国家安全与社会稳定红线，是一场\"发展与安全\"的再平衡。","impact":"头部互联网、金融、出行、社交平台合规成本上升，需设独立监督机构；利好隐私计算、数据安全产业；普通用户数据控制权增强。","view":"1000万人的门槛划得很清晰——监管资源集中打\"大老虎\"，中小平台先喘口气，但合规标准只会越来越高。"},{"date":"2026-08-09","keywords":"：可再生能源强制消纳 · 北京楼市松绑 · 平台数据分级监管 · 未来产业政府基金 · 就业优先国家战略","title":"上海\"政府当VC\"：150亿未来产业基金+项目经理制，抢脑机接口/量子/6G","what":"央视《新闻联播》8月8日报道，上海锚定\"十五五\"未来产业赛道，推出\"项目经理制度\"——政府科委人员挂职项目经理，调度科研、产业、投资、智库资源，全程对接研发到量产；布局19家高质量孵化器，设立约150亿元未来产业基金，瞄准脑机接口、量子计算、6G、绿色燃料等20多个细分赛道，已累计验证近200项科研成果。","why":"这是地方政府从\"给政策\"升级为\"下场组局\"——亲自当项目经理、当早期投资人，用组织创新破解\"基础研究强、转化弱\"的痛点。","gov":"政府是\"产业组织者+风险投资者\"。动力来自\"十五五\"开局抢制高点的焦虑——未来产业投入大、周期长、风险高，纯市场资本不敢早投，政府必须挺身而出做\"第一个出资人\"和\"资源调度员\"，否则关键技术会被卡、产业会被别人占先，本质是用公共资金补市场的\"早期胆小\"。","impact":"脑机接口、量子、6G、绿色燃料等赛道获资金和场景倾斜；科创团队融资环境改善；其他城市可能复制\"项目经理制\"。","view":"从\"招商\"到\"创商\"，上海把政府信用和资金直接押注在硬科技早期，赌的是未来十年的产业话语权。"},{"date":"2026-08-09","keywords":"：可再生能源强制消纳 · 北京楼市松绑 · 平台数据分级监管 · 未来产业政府基金 · 就业优先国家战略","title":"就业优先战略升格为国家专项规划：首次单独立项\"十五五\"","what":"国务院印发《实施就业优先战略\"十五五\"规划》（国发〔2026〕16号），我国首次将就业优先战略单独编制为国家级五年规划。8月7日国盛证券熊园专访引发再讨论：强调把就业优先\"嵌入\"财政、金融、产业、教育政策，把重大政策出台前的\"就业影响评估\"做实。当前4月城镇调查失业率5.2%，青年、农民工、新就业形态等结构性矛盾突出。","why":"就业从\"民生保障的组成部分\"升级为\"国家战略级独立部署\"，意味着稳增长、上项目、推AI都要先过\"就业账\"。","gov":"政府是\"战略设计者+多部门协同操盘手\"。动力来自一个深层担忧——AI和部分行业冲击下结构性失业风险上升，而就业是消费循环和社会信心的\"压舱石\"。如果人没事干、钱不敢花，再多的产业规划也转不动。所以政府逼着各部门\"算就业账\"，本质是怕经济循环断在\"人\"这一环。","impact":"重大项目、产业政策将更强调吸纳就业；职业技能培训（尤其AI技能）扩围；民企、中小微、服务业稳岗政策延续；毕业生、农民工群体是重点。","view":"把\"就业优先\"从口号写进五年规划，说明决策层已把\"人的饭碗\"当作经济循环的命门来守。 **📎 今日关键词**：可再生能源强制消纳 · 北京楼市松绑 · 平台数据分级监管 · 未来产业政府基金 · 就业优先国家战略"},{"date":"2026-08-10","keywords":"：知识产权十五五 · 首发经济 · 光伏最低价 · 自动驾驶强制国标 · CPI/PPI","title":"国常会审议通过《知识产权保护和运用\"十五五\"规划》","what":"发生了什么：近日国常会审议通过该规划，明确\"十五五\"知识产权\"施工图\"，首次系统部署人工智能生成物可专利性、算法与数据知识产权保护规则，并常态化更新AI/大数据商标注册清单（已开放900余项）。","why":"为什么值得关注：AI生成内容版权归属、数据产权界定长期是灰色地带，规划把\"规则空白\"变成\"制度供给\"，直接关系万亿级AI与数据产业的创新激励与法律风险。","gov":"政府角色与动力：政府是\"规则制定者+前瞻布局者\"——AI浪潮下，谁定标准谁握产业话语权。动力在数字经济国际竞争中抢跑：用专利池、审查标准护航国产AI，避免被西方规则\"卡脖子\"。","impact":"可能影响：AI企业、数据服务商、内容平台的确权与合规；国产大模型生态的专利护城河。","view":"我的看法：从\"补法律短板\"转向\"立未来规则\"，中国正把知识产权变成市场竞争的核心资产。"},{"date":"2026-08-10","keywords":"：知识产权十五五 · 首发经济 · 光伏最低价 · 自动驾驶强制国标 · CPI/PPI","title":"国务院批复《扩大消费\"十五五\"规划》，首发经济成新抓手","what":"发生了什么：国务院近期批复原则同意《扩大消费\"十五五\"规划》，提出因地制宜推进\"首发经济\"——支持国内外品牌开高能级首店、办首发首秀首展，便利首发新品进口，优化审批备案。","why":"为什么值得关注：在\"促内需\"从补贴转向\"造场景\"的节点，首发经济用\"新品+体验\"引流，上海日均2家首店、南京累计引1700家，已成城市消费能级标尺。","gov":"政府角色与动力：政府是\"战略设计者+最大消费组织者\"——内需疲弱下，靠规则松绑和场景供给激活\"尝鲜消费\"，动力是稳消费基本盘、用新供给创造新需求，避免简单\"发钱式\"刺激。","impact":"可能影响：商业地产、品牌零售、进口贸易；一线城市国际消费中心建设提速。","view":"我的看法：从\"买便宜\"到\"买新鲜\"，消费政策开始学用\"流量思维\"。"},{"date":"2026-08-10","keywords":"：知识产权十五五 · 首发经济 · 光伏最低价 · 自动驾驶强制国标 · CPI/PPI","title":"美国对华光伏设\"最低进口价\"+15%关税，中方启动法律反制","what":"发生了什么：特朗普8月签署公告，对多晶硅及下游产品加征15%关税并设最低进口价（多晶硅≥21美元/公斤），12月4日执行；中方8月5日起依《反外国制裁法》对7家美实体实施资产冻结、入境管控等反制。","why":"为什么值得关注：美方从\"收税\"升级到\"定最低售价\"，直接干预进口价格——比关税更狠；中方从\"对等关税\"转向\"法律清单点名\"，斗争从价格表拉到规则表。","gov":"政府角色与动力：美方是\"产业保护者+规则操盘手\"——美国多晶硅产能从2005年全球约一半跌至2024年不足2%，用行政定价救本土制造；中方是\"规则对抗者\"，用法律工具箱把反制钉在日历上，可控、可查、可回旋。","impact":"可能影响：光伏出口企业利润与合规成本；中美\"边谈边压\"延续至11月休战期末。","view":"我的看法：贸易战进入\"法律战\"阶段，企业合规成本会成新变量。"},{"date":"2026-08-10","keywords":"：知识产权十五五 · 首发经济 · 光伏最低价 · 自动驾驶强制国标 · CPI/PPI","title":"智能网联汽车自动驾驶强制国标发布，L3/L4有了安全底线","what":"发生了什么：工信部归口、市场监管总局与国标委批准发布《智能网联汽车 自动驾驶系统安全要求》(GB 44721—2026)强制性国标，适用于L3/L4级M/N类车辆，拟2027年7月1日实施。","why":"为什么值得关
