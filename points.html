<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>多账号积分统计系统</title>
<style>
:root{
  --bg:#ffffff; --surface:#ffffff;
  --line:#d4caee; --line-strong:#d7cfed;
  --text:#241d3b; --muted:#6c618c;
  --purple:#7659cc; --purple2:#bbaee3; --purple-deep:#5b46a8; --purple-mid:#8f78d1;
  --purple-soft:#f3eefc;
  --red:#ef4444; --red-soft:#fdeaea;
  --amber:#f59e0b; --amber-soft:#fdf3e0;
  --tile:#f7f8fc;
  --shadow:0 4px 16px rgba(112,98,153,.08);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus{outline:2px solid var(--purple2);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.topbar h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.topbar h1 .t-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--purple2));margin-right:8px;vertical-align:1px}
.top-actions{display:flex;align-items:center;gap:10px}
.sync-hint{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:11px;padding:9px 15px;font-size:13.5px;font-weight:600;transition:filter .12s,transform .12s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));border:none;color:#fff;box-shadow:var(--shadow)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:7px 12px;border-radius:9px;font-size:12.5px}
main{padding:20px 0 60px}
.notice{background:var(--purple-soft);color:var(--purple-deep);border-radius:12px;padding:11px 15px;font-size:13px;margin-bottom:16px;font-weight:600}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.toolbar h2::before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--purple2))}
.acc-list{display:flex;flex-direction:column;gap:12px}
.acc-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.acc-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.acc-name{font-weight:800;font-size:16px}
.acc-total{font-size:26px;font-weight:800;color:var(--purple-deep);font-variant-numeric:tabular-nums;line-height:1.2}
.acc-total.na{color:var(--muted);font-size:18px;font-weight:600}
.acc-meta{font-size:12px;color:var(--muted);margin-top:2px}
.acc-near{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.acc-near .n-label{font-size:12px;color:var(--muted);font-weight:600}
.acc-near .n-val{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.n-red{color:var(--red)}.n-amber{color:#b87a0a}.n-purple{color:var(--purple-deep)}.n-ok{color:var(--muted)}
.n-date{font-size:12px;font-weight:700}
.acc-note{font-size:11.5px;color:var(--muted);margin-top:8px;word-break:break-all}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:13.5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.modal-mask{position:fixed;inset:0;background:rgba(36,29,59,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-mask.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r);padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(36,29,59,.18)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:86vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.danger-zone{border:1px solid var(--red);border-radius:12px;padding:14px;margin-top:16px}
.danger-zone h3{color:var(--red)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
@media (max-width:640px){
  .form-grid{grid-template-columns:1fr}
  .settings-grid{grid-template-columns:1fr}
  .sync-hint{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <h1><span class="t-dot"></span>多账号积分统计</h1>
    <div class="top-actions">
      <span class="sync-hint">数据仅存本机</span>
      <button class="btn sm" id="quickBackup">导出备份</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="notice">每周在各账号 App 内看一眼：剩余总积分 + 最近哪笔到期。点账号卡片即可更新，统计日期默认填今天。</div>
  <div class="toolbar">
    <h2>账号积分一览</h2>
    <button class="btn primary" id="addBtn">+ 新增账号</button>
  </div>
  <div class="acc-list" id="accList"></div>
  <div class="settings-grid">
    <div class="card" style="background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)">
      <h2 style="font-size:15px;font-weight:800;margin-bottom:10px">数据管理</h2>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" id="exportJson">导出 JSON 备份</button>
        <label class="btn" style="text-align:center">导入 JSON 备份<input type="file" id="importJson" accept=".json" style="display:none"/></label>
      </div>
      <div class="hint" id="storageHint"></div>
    </div>
    <div class="danger-zone">
      <h3 style="font-size:14px;font-weight:800;margin-bottom:8px">危险区</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px">清空所有账号记录，不可恢复。</p>
      <button class="btn danger" id="clearAll">清空所有数据</button>
    </div>
  </div>
</main>

<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
var KEY = 'wbp2_accounts';
var SEED = [
  { id:'acc_jaylen', name:'Jaylen',   total:null, totalDate:'', nearAmt:null, nearDate:'', note:'user_id: eebc3528-a7fb-42ab-adc2-cc69416f1a9a · 待录入' },
  { id:'acc_lzh',    name:'凌子禾',   total:1216.88, totalDate:'2026-10-25', nearAmt:97.08, nearDate:'2026-11-20', note:'user_id: cb89b632-65df-463b-85d5-21b7a23c6f0f · 官方 plans-usage 截图校准（最近到期笔：成长计划奖励 300 余 97.08，11-20 20:19:47）' },
  { id:'acc_lzh2',   name:'凌子禾2',  total:null, totalDate:'', nearAmt:null, nearDate:'', note:'user_id: 2238a68a-20f3-4925-8546-aad63ba8d2df · 待录入' },
  { id:'acc_zxsx',   name:'子禾师兄', total:null, totalDate:'', nearAmt:null, nearDate:'', note:'user_id: f69e83b3-f8d1-462b-ba22-461349b723eb · 待录入' },
  { id:'acc_wen',    name:'文',       total:null, totalDate:'', nearAmt:null, nearDate:'', note:'user_id: 83ffe977-c094-4639-bb73-37ef56691235 · 待录入' }
];
var storageOK = (function(){
  try { localStorage.setItem('__wbp2_probe', '1'); localStorage.removeItem('__wbp2_probe'); return true; } catch(e){ return false; }
})();
var memStore = {};
var store = {
  get: function(k, d){
    try {
      if (!storageOK) return Object.prototype.hasOwnProperty.call(memStore, k) ? JSON.parse(memStore[k]) : d;
      var v = localStorage.getItem(k); return v ? JSON.parse(v) : d;
    } catch(e){ return d; }
  },
  set: function(k, v){
    var s = JSON.stringify(v);
    try { if (storageOK) { localStorage.setItem(k, s); return; } } catch(e){ storageOK = false; }
    memStore[k] = s;
  }
};
var accounts = store.get(KEY, null);
if (!Array.isArray(accounts)) { accounts = SEED.slice(); store.set(KEY, accounts); }
function save(){ store.set(KEY, accounts); }
function uid(){ return 'acc_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }
function today(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function md(iso){ return iso ? iso.slice(5).replace('-', '-') : '—'; }
function daysLeft(iso){ if(!iso) return null; var t = new Date(today()+'T00:00:00'); var e = new Date(iso.slice(0,10)+'T00:00:00'); return Math.round((e - t) / 86400000); }
function fmt(n){ return Number(n).toLocaleString('zh-CN', {maximumFractionDigits: 2}); }
function nearClass(dl){ if (dl === null) return 'n-ok'; if (dl < 0) return 'n-red'; if (dl <= 7) return 'n-red'; if (dl <= 14) return 'n-amber'; if (dl <= 30) return 'n-purple'; return 'n-ok'; }
function nearText(a){
  if (a.nearAmt === null || a.nearAmt === undefined || a.nearAmt === '' || !a.nearDate) return '<span class="n-val n-ok">—</span>';
  var dl = daysLeft(a.nearDate);
  var cls = nearClass(dl);
  var tail = dl === null ? '' : (dl < 0 ? ('已过期 ' + Math.abs(dl) + ' 天') : ('还剩 ' + dl + ' 天'));
  return '<span class="n-val ' + cls + '">' + fmt(a.nearAmt) + '</span> <span class="n-date ' + cls + '">' + md(a.nearDate) + ' 到期' + (tail ? ' · ' + tail : '') + '</span>';
}
function sorted(){
  return accounts.slice().sort(function(a,b){
    var da = a.nearDate || '9999-99-99', db = b.nearDate || '9999-99-99';
    if (da !== db) return da < db ? -1 : 1;
    return String(a.name).localeCompare(String(b.name), 'zh');
  });
}

if (typeof document !== 'undefined' && typeof localStorage !== 'undefined') (function(){
  window.addEventListener('error', function(e){
    try {
      var b = document.getElementById('errBanner');
      if (!b){ b = document.createElement('div'); b.id = 'errBanner'; b.className = 'notice'; b.style.cssText = 'background:var(--red-soft);color:var(--red);margin:10px 16px 0'; document.body.insertBefore(b, document.body.firstChild); }
      b.textContent = '运行出错：' + (e.message || '未知错误');
    } catch(err){}
  });
  function $(s){ return document.querySelector(s); }
  function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2400); }
  function openModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('modalMask').classList.add('open'); }
  function closeModal(){ document.getElementById('modalMask').classList.remove('open'); }
  document.getElementById('modalMask').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
  window.__closeModal = closeModal;

  function render(){
    var list = sorted();
    document.getElementById('accList').innerHTML = list.map(function(a){
      var totalHtml = (a.total === null || a.total === undefined || a.total === '')
        ? '<div class="acc-total na">待录入</div><div class="acc-meta">总积分 · 暂无数据</div>'
        : '<div class="acc-total">' + fmt(a.total) + '</div><div class="acc-meta">总积分 · ' + md(a.totalDate) + ' 统计</div>';
      return '<div class="acc-card" data-edit="' + a.id + '">' +
        '<div class="acc-row1"><span class="acc-name">' + esc(a.name) + '</span><button class="btn sm" data-edit="' + a.id + '">更新</button></div>' +
        totalHtml +
        '<div class="acc-near"><span class="n-label">最近到期积分</span>' + nearText(a) + '</div>' +
        (a.note ? '<div class="acc-note">' + esc(a.note) + '</div>' : '') +
      '</div>';
    }).join('') || '<div class="empty">还没有账号，点右上角「+ 新增账号」</div>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function(el){
      el.addEventListener('click', function(ev){ ev.stopPropagation(); openForm(accounts.filter(function(x){ return x.id === el.getAttribute('data-edit'); })[0]); });
    });
    var filled = accounts.filter(function(a){ return a.total !== null && a.total !== undefined && a.total !== ''; }).length;
    var lastDate = '';
    accounts.forEach(function(a){ if (a.totalDate && a.totalDate > lastDate) lastDate = a.totalDate; });
    document.getElementById('storageHint').textContent = filled + '/' + accounts.length + ' 个账号已录入' + (lastDate ? ' · 最近统计 ' + md(lastDate) : '') + (storageOK ? '' : ' · ⚠️当前环境禁本地存储，刷新丢失');
  }

  function openForm(acc){
    var a = acc || { name:'', total:'', totalDate: today(), nearAmt:'', nearDate:'', note:'' };
    openModal('<h3>' + (acc ? '更新积分' : '新增账号') + '</h3><div class="form-grid">' +
      '<div class="full"><label>名称</label><input id="f_name" value="' + esc(a.name) + '" placeholder="账号名称"/></div>' +
      '<div><label>总积分</label><input type="number" id="f_total" step="any" min="0" value="' + (a.total===null||a.total===undefined?'':a.total) + '" placeholder="App 内剩余总数"/></div>' +
      '<div><label>统计日期</label><input type="date" id="f_totalDate" value="' + (a.totalDate || today()) + '"/></div>' +
      '<div><label>最近到期积分</label><input type="number" id="f_nearAmt" step="any" min="0" value="' + (a.nearAmt===null||a.nearAmt===undefined?'':a.nearAmt) + '" placeholder="最早到期那笔的剩余量"/></div>' +
      '<div><label>该笔到期日期</label><input type="date" id="f_nearDate" value="' + (a.nearDate || '') + '"/></div>' +
      '<div class="full"><label>备注（可选）</label><input id="f_note" value="' + esc(a.note) + '"/></div>' +
      '</div><div class="form-actions">' +
      (acc ? '<button class="btn danger" id="f_del">删除</button>' : '') +
      '<button class="btn" onclick="window.__closeModal()">取消</button>' +
      '<button class="btn primary" id="f_save">保存</button></div>');
    document.getElementById('f_save').addEventListener('click', function(){
      var name = document.getElementById('f_name').value.trim();
      if (!name){ toast('名称不能为空'); return; }
      var num = function(id){ var v = document.getElementById(id).value; return v === '' ? null : Number(v); };
      var data = {
        name: name,
        total: num('f_total'),
        totalDate: document.getElementById('f_totalDate').value || '',
        nearAmt: num('f_nearAmt'),
        nearDate: document.getElementById('f_nearDate').value || '',
        note: document.getElementById('f_note').value.trim()
      };
      if (data.total !== null && !data.totalDate){ data.totalDate = today(); }
      if (acc){ for (var k in data) acc[k] = data[k]; toast('已更新'); }
      else { accounts.push(Object.assign({ id: uid() }, data)); toast('已添加'); }
      save(); closeModal(); render();
    });
    if (acc){
      document.getElementById('f_del').addEventListener('click', function(){
        openModal('<h3>删除账号</h3><p style="font-size:13.5px;margin-bottom:14px">确定删除「' + esc(acc.name) + '」？不可恢复。</p><div class="form-actions"><button class="btn" onclick="window.__closeModal()">取消</button><button class="btn danger" id="__delOk">确认删除</button></div>');
        document.getElementById('__delOk').addEventListener('click', function(){
          accounts = accounts.filter(function(x){ return x.id !== acc.id; });
          save(); closeModal(); render(); toast('已删除');
        });
      });
    }
  }
  document.getElementById('addBtn').addEventListener('click', function(){ openForm(null); });

  function download(name, text, mime){
    var blob = new Blob([text], { type: mime || 'application/json' });
    var el = document.createElement('a');
    el.href = URL.createObjectURL(blob); el.download = name;
    document.body.appendChild(el); el.click();
    setTimeout(function(){ URL.revokeObjectURL(el.href); el.remove(); }, 500);
  }
  document.getElementById('exportJson').addEventListener('click', function(){
    download('积分统计备份_' + today() + '.json', JSON.stringify({ accounts: accounts }, null, 2));
    toast('已导出备份');
  });
  document.getElementById('quickBackup').addEventListener('click', function(){
    download('积分统计备份_' + today() + '.json', JSON.stringify({ accounts: accounts }, null, 2));
    toast('已导出备份');
  });
  document.getElementById('importJson').addEventListener('change', function(e){
    var f = e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var d = JSON.parse(rd.result);
        var arr = Array.isArray(d) ? d : d.accounts;
        if (!Array.isArray(arr) || !arr.length || !arr[0].name){ toast('文件格式不对'); return; }
        openModal('<h3>导入备份</h3><p style="font-size:13.5px;margin-bottom:14px">导入将<b>覆盖</b>当前 ' + accounts.length + ' 个账号记录。建议先导出一份再操作。</p><div class="form-actions"><button class="btn" onclick="window.__closeModal()">取消</button><button class="btn primary" id="__impOk">确认导入</button></div>');
        document.getElementById('__impOk').addEventListener('click', function(){
          accounts = arr.map(function(x){ return { id: x.id || uid(), name: x.name || '未命名', total: (x.total===undefined?null:x.total), totalDate: x.totalDate||'', nearAmt: (x.nearAmt===undefined?null:x.nearAmt), nearDate: x.nearDate||'', note: x.note||'' }; });
          save(); closeModal(); render(); toast('导入完成');
        });
      } catch(err){ toast('解析失败：' + err.message); }
    };
    rd.readAsText(f);
    e.target.value = '';
  });
  document.getElementById('clearAll').addEventListener('click', function(){
    openModal('<h3>清空所有数据</h3><p style="font-size:13.5px;margin-bottom:14px">将删除全部账号记录，<b>不可恢复</b>。输入「确认」二字执行。</p><input id="__clearTxt" placeholder="输入 确认"/><div class="form-actions"><button class="btn" onclick="window.__closeModal()">取消</button><button class="btn danger" id="__clearOk">执行清空</button></div>');
    document.getElementById('__clearOk').addEventListener('click', function(){
      if (document.getElementById('__clearTxt').value.trim() !== '确认'){ toast('输入不正确，未执行'); return; }
      accounts = []; save(); closeModal(); render(); toast('已清空');
    });
  });

  if (!storageOK) {
    var b = document.createElement('div');
    b.className = 'notice';
    b.style.cssText = 'background:var(--red-soft);color:var(--red);margin:10px 16px 0';
    b.textContent = '当前环境禁止本地存储（预览窗口常见限制），数据刷新后会丢失。请保存文件到电脑上用浏览器打开。';
    document.body.insertBefore(b, document.body.firstChild);
  }
  render();
})();
</script>
</body>
</html>
